
[project]
name = "velto-core"
version = "0.1.2"
requires-python = ">=3.10,<3.14.20"
description = "Velto is a declarative, reactive Python UI framework with native rendering, expressive PSX markup, and cross-platform layout powered by Cinnamon."
readme = "README.md"
authors = [
    { name = "runesc", email = "luisalfredoreyes98@gmail.com" }
]
license = "MIT"
keywords = [
    "velto",
    "ui",
    "declarative",
    "reactive",
    "native",
    "psx",
    "rust",
    "pyside6",
    "pyqt6",
    "pyqt5",
    "pyside2",
    "kivy",
    "tkinter"
]
dependencies = [
    "resvg_py>=0.5,<0.6",
    "velto-cinnamon-core>=0.1.1,<1.0.0"
]

[project.optional-dependencies]
pyside6 = ["PySide6>=6.11; python_version < '3.14.20'"]
pyqt6 = ["PyQt6>=6.8; python_version < '3.14.20'"]
pyqt5 = ["PyQt5>=5.15; python_version < '3.14.20'"]
pyside2 = ["PySide2>=5.15,<6; python_version < '3.11'"]
kivy = ["Kivy>=2.3.2"]

dev = [
    "pytest>=9.2.0",
    "psutil>=5.9",
    "tomli>=2; python_version < '3.11'",
    "build>=1.2",
    "ruff",
    "playwright (>=1.64.1,<2.0.0)",
    "pyqtgraph (>=0.14.0,<0.15.0)",
    "maturin (>=1.16.0,<2.0.0)"
]

[project.scripts]
velto-transform = "psx.markup.transform:main"
velto-dev = "psx.devtools.__main__:main"

[tool.poetry]
packages = [{ include = "psx" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.poetry.dependencies]
velto-cinnamon-core = { path = "rust/cinnamon-core", develop = false }
