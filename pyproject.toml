
[project]
name = "velto"
version = "1.0.0a1"
description = "Velto is a declarative, reactive Python UI framework with native rendering, expressive PSX markup, and cross-platform layout powered by Cinnamon."
readme = "README.md"
authors = [
    { name = "runesc", email = "luisalfredoreyes98@gmail.com" }
]
license = "MIT"
keywords = [
    "velto",
    "ui",
    "declarative",
    "reactive",
    "native",
    "psx",
    "rust",
    "pyside6",
    "pyqt6",
    "pyqt5",
    "pyside2",
    "kivy",
    "tkinter"
]
requires-python = ">=3.10,<3.14"
dependencies = []

[project.optional-dependencies]
pyside6 = ["PySide6>=6.8; python_version < '3.14'"]
pyqt6 = ["PyQt6>=6.8; python_version < '3.14'"]
pyqt5 = ["PyQt5>=5.15; python_version < '3.14'"]
pyside2 = ["PySide2>=5.15,<6; python_version < '3.11'"]
kivy = ["Kivy>=2.3"]

pydux = ["pydux>=1.0.0a1,<2.0.0"]
qyro = ["qyro-engine>=1.0.0a1,<2.0.0"]

dev = [
    "pytest>=8.0",
    "build>=1.2",
    "ruff"
]

[project.scripts]
velto-transform = "psx.markup.transform:main"
velto-dev = "psx.devtools.__main__:main"

[tool.poetry]
packages = [{ include = "psx" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
