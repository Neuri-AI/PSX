name: SFLE core checks

on:
  pull_request:
    paths:
      - "psx/sfle/**"
      - "rust/sfle-core/**"
      - "tests/sfle/**"
      - ".github/workflows/sfle-core.yml"
      - "pyproject.toml"
  push:
    branches:
      - "feat/sfle-f2-core"
    paths:
      - "psx/sfle/**"
      - "rust/sfle-core/**"
      - "tests/sfle/**"
      - ".github/workflows/sfle-core.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect SFLE changes
    runs-on: ubuntu-latest
    outputs:
      sfle: ${{ steps.filter.outputs.sfle }}
    steps:
      - name: Inspect current PR update
        id: filter
        uses: actions/github-script@v7
        with:
          script: |
            const affectsSFLE = path =>
              path.startsWith('psx/sfle/') ||
              path.startsWith('rust/sfle-core/') ||
              path.startsWith('tests/sfle/') ||
              path === 'pyproject.toml' ||
              path === '.github/workflows/sfle-core.yml';
            let files;
            if (context.eventName === 'pull_request' &&
                context.payload.action === 'synchronize') {
              const before = context.payload.before;
              const after = context.payload.after;
              if (before && after) {
                const response = await github.rest.repos.compareCommits({
                  owner: context.repo.owner, repo: context.repo.repo,
                  base: before, head: after, per_page: 100,
                });
                files = response.data.files || [];
                if (response.data.total_commits > 250 || files.length >= 300) {
                  core.warning('Diff too large to classify safely; run SFLE tests.');
                  core.setOutput('sfle', 'true');
                  return;
                }
              }
            }
            if (!files && context.eventName === 'pull_request') {
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: context.issue.number, per_page: 100,
              });
            }
            if (!files) {
              // A push passed the event-level paths filter.
              core.setOutput('sfle', 'true');
              return;
            }
            const changed = files.some(
              file => affectsSFLE(file.filename) ||
                      (file.previous_filename && affectsSFLE(file.previous_filename))
            );
            core.info(`Relevant SFLE changes: ${changed}`);
            core.setOutput('sfle', String(changed));

  python-contracts:
    needs: changes
    if: needs.changes.outputs.sfle == 'true'
    name: Python SFLE / ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e . pytest
      - name: Compile SFLE Python
        run: python -m compileall -q psx/sfle
      - name: SFLE focused tests
        run: python -m pytest -q tests/sfle

  rust-core:
    needs: changes
    if: needs.changes.outputs.sfle == 'true'
    name: Rust SFLE core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/sfle-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust unit tests
        run: cargo test --all-targets
