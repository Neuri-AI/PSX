name: Cinnamon viewport native certification
on:
  push:
    branches: [fixes/psx-issues]
    paths:
      - "psx/layout/**"
      - "psx/renderers/**"
      - "tests/test_grid_viewport*"
      - "tests/test_native_flow_viewport.py"
      - "tests/test_viewport_scroll_reentry.py"
      - "tests/test_mounted_grid_native_renderers.py"
      - ".github/workflows/viewport-native-certification.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # The same feature branch may receive multiple incremental fixes while
  # platform runners are busy. Certify only the newest commit.
  group: cinnamon-viewport-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  viewport-policy:
    name: Pure viewport workset, CSS safety and scroll reentry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PSX and pytest
        run: python -m pip install -e . pytest
      - name: Verify 500-card workset and three backend native ports
        run: |
          python -m pytest -q \
            tests/test_grid_viewport_workset.py \
            tests/test_grid_viewport_native_three_backends.py \
            tests/test_viewport_scroll_reentry.py \
            tests/test_native_flow_viewport.py

  real-native:
    name: Actual mounted Grid native viewport / ${{ matrix.backend }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        backend: [qt, tk, kivy]
    env:
      PSX_GRID_BACKEND: ${{ matrix.backend }}
      PSX_QT_BINDING: pyside6
      QT_QPA_PLATFORM: offscreen
      KIVY_NO_ARGS: "1"
      KIVY_NO_CONSOLELOG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install native desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth python3-tk libegl1 libopengl0 \
            libxkbcommon-x11-0 libxcb-cursor0 libmtdev1 \
            libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-ttf-2.0-0
          python -m pip install -e '.[pyside6,kivy]' pytest
      - name: Verify actual Qt/Tk/Kivy sparse commits and viewport reentry
        run: |
          xvfb-run -a python -m pytest -q \
            tests/test_mounted_grid_native_renderers.py \
            -k "automatic_grid_viewport_sparse_commit_and_resize_reentry or automatic_html_card_flow_deferred_native_resize or scroll_newly_visible_grid_items_receive_native_geometry or scroll_wrapped_grid_item_uses_native_viewport_across_backends"
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile actual Cinnamon Rust wheel and enforce Rust backend
        run: |
          python -m pip install 'maturin>=1.8,<2'
          maturin build --release --manifest-path rust/sfle-core/Cargo.toml --out wheelhouse
          python -m pip install --no-deps --find-links wheelhouse 'psx-sfle-native==0.1.0'
          python -c "from psx.layout.engine.backend import load_layout_engine; assert load_layout_engine().backend_name == 'rust'"
      - name: Certify viewport native reentry with Cinnamon Rust (no fallback)
        env:
          PSX_VIEWPORT_ENGINE: rust
        run: |
          xvfb-run -a python -m pytest -q \
            tests/test_mounted_grid_native_renderers.py \
            -k "automatic_grid_viewport_sparse_commit_and_resize_reentry or automatic_html_card_flow_deferred_native_resize or scroll_newly_visible_grid_items_receive_native_geometry or scroll_wrapped_grid_item_uses_native_viewport_across_backends"

