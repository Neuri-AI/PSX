name: F5.5 G1 declared surface audit

on:
  pull_request:
    types: [ready_for_review]
    branches: [develop]
    paths:
      - "scripts/docs/**"
      - "tests/test_docs_full_api_audit.py"
      - "psx/**"
      - ".github/workflows/f5-5-g1-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  declared-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit public symbols and component contracts
        run: |
          python scripts/docs/full_api_audit.py --write /tmp/f5-5-g1-declared-surface.json
          python scripts/docs/full_api_audit.py --check /tmp/f5-5-g1-declared-surface.json
          python -m unittest discover -s tests -p test_docs_full_api_audit.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-declared-surface
          path: /tmp/f5-5-g1-declared-surface.json
          if-no-files-found: error
