name: Runtime package boundaries

on:
  push:
    branches: [main, feature/f3-sfle-native-adapters]
    paths:
      - "psx/**"
      - "scripts/check_runtime_boundaries.py"
      - ".github/workflows/runtime-boundaries.yml"
  pull_request:
    types: [ready_for_review]
    paths:
      - "psx/**"
      - "scripts/check_runtime_boundaries.py"
      - ".github/workflows/runtime-boundaries.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-impact:
    uses: ./.github/workflows/docs-delta.yml

  boundaries:
    needs: docs-impact
    if: needs.docs-impact.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce certification ownership
        run: python scripts/check_runtime_boundaries.py
      - name: Compile relocated certification modules
        run: python -m compileall -q tests/certification
      - name: Verify canonical imports and runtime isolation
        run: |
          python -m pip install -e .
          python - <<'PY'
          import importlib
          from pathlib import Path

          import psx

          assert not (Path(psx.__file__).parent / "sfle").exists(), (
              "Certification-only psx.sfle package must not be shipped in the runtime"
          )
          names = (
              "native_external_ownership_cases",
              "native_external_ownership_receipts",
              "native_operation_contracts",
              "native_operation_evidence",
              "native_component_matrix",
              "native_operation_oracles",
              "native_operation_receipts",
          )
          for name in names:
              module = importlib.import_module(f"tests.certification.{name}")
              assert module.__file__ is not None
              assert Path(module.__file__).resolve().is_relative_to(
                  Path("tests/certification").resolve()
              ), (name, module.__file__)
          print("Canonical certification imports and runtime isolation verified.")
          PY
