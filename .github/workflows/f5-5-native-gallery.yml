name: F5.5 native gallery smoke

on:
  pull_request:
    branches: [develop]
    paths:
      - "examples/f5_5_native_gallery/**"
      - "docs/public/examples/native-gallery.mdx"
      - ".github/workflows/f5-5-native-gallery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-gallery-tkinter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: python -m pip install -e .
      - run: xvfb-run -a python examples/f5_5_native_gallery/app.py --smoke
