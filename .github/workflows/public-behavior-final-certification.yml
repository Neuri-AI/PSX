name: Final public behavior certification

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful full native-layout workflow run holding all original JUnit artifacts"
        required: true
        type: string
      commit_sha:
        description: "Immutable 40-character PSX commit SHA to certify"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify complete immutable-SHA public behavior certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify full SHA and source native-layout run
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ inputs.commit_sha }}';
            const runId = Number('${{ inputs.source_run_id }}');
            if (!/^[0-9a-f]{40}$/.test(sha) || !Number.isSafeInteger(runId) || runId < 1) {
              core.setFailed('Full lowercase SHA and positive source_run_id required');
              return;
            }
            const data = (await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: runId,
            })).data;
            if (data.head_sha !== sha || data.name !== 'Native layout selective validation' ||
                data.status !== 'completed' || data.conclusion !== 'success') {
              core.setFailed('Source run must be a successful native-layout run at the exact SHA');
            }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: public-*
          path: public-artifacts
      - name: Reject missing platform artifacts, duplicate claims and incomplete coverage
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          required=(
            public-behavior-inventory
            public-native-qt-receipts-pyside6
            public-native-qt-receipts-pyqt6
            public-native-qt-receipts-pyqt5
            public-native-qt-receipts-pyside2
            public-native-tk-receipts
            public-native-kivy-receipts
            public-native-headless-receipts
          )
          files=()
          for artifact in "${required[@]}"; do
            dir="public-artifacts/$artifact"
            test -d "$dir" || { echo "Missing native artifact: $artifact"; exit 1; }
            mapfile -t candidates < <(find "$dir" -maxdepth 1 -type f -name '*-receipts.json')
            test "${#candidates[@]}" -eq 1 || { echo "Expected one receipt manifest: $artifact"; exit 1; }
            files+=(--receipt-file "${candidates[0]}")
          done
          python -m tests.certification.public_behavior_census \
            --out public-behavior-final-inventory.json \
            --sha "$EXPECTED_SHA" "${files[@]}" --require-complete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-public-behavior-inventory
          path: |
            public-behavior-final-inventory.json
            public-behavior-final-inventory-final-report.json
          if-no-files-found: warn
