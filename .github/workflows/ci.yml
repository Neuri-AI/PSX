name: PSX alpha validation

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Inspect current PR update
        id: filter
        uses: actions/github-script@v7
        with:
          script: |
            const isDoc = path => path.startsWith('docs/') ||
              path === 'README.md' || path.endsWith('.md');
            let files;
            if (context.eventName === 'pull_request' &&
                context.payload.action === 'synchronize') {
              const before = context.payload.before;
              const after = context.payload.after;
              if (before && after) {
                const result = await github.rest.repos.compareCommits({
                  owner: context.repo.owner, repo: context.repo.repo,
                  base: before, head: after, per_page: 100,
                });
                files = result.data.files || [];
                // GitHub Compare's changed-file list is capped at 300.
                if (result.data.total_commits > 250 || files.length >= 300) {
                  core.warning('Diff exceeds safe inspection bounds: run CI.');
                  core.setOutput('code', 'true');
                  return;
                }
              }
            }
            if (!files && context.eventName === 'pull_request') {
              const pull_number = context.issue.number;
              const changes = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number, per_page: 100,
              });
              files = changes;
            }
            if (!files) {
              // Push events are already filtered with paths-ignore below.
              core.setOutput('code', 'true');
              return;
            }
            const code = files.some(file => !isDoc(file.filename) ||
              (file.previous_filename && !isDoc(file.previous_filename)));
            core.info(`Changed paths: ${files.map(file => file.filename).join(', ') || '(none)'}`);
            core.setOutput('code', String(code));

  core:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_core.py tests/test_hooks_scheduler.py tests/test_markup.py tests/test_markup_transform.py tests/test_devtools.py
      - run: PYTHONPATH=src python benchmarks/psx_benchmark.py --iterations 20 --repeats 3

  pyside6:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: PySide6 offscreen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libopengl0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,qt]'
      - name: Install Neuri PyDux (pinned source)
        run: |
          python -m pip install "git+https://github.com/Neuri-AI/Pydux.git@56e6df858bc0e1ae598cd1cab0aa384c921cf253"
          python -c "from pydux import Action, Store; print('Neuri PyDux API available')"
      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q tests/test_pyside6_renderer.py

  package:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m zipfile -l dist/*.whl
