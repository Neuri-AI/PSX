name: Kivy Retina CSS parity

on:
  push:
    branches: [fixes/psx-issues]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale-math:
    name: Retina CSS scale math / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CSS/core and Kivy environment
        run: python -m pip install -e '.[kivy]' pytest Pillow
      - name: Install headless X server for Linux Kivy collection
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libmtdev1 libgl1 libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Certify Kivy drawable/system metric conversion independent of WindowServer
        env:
          KIVY_NO_ARGS: '1'
          KIVY_NO_FILELOG: '1'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a python -m pytest -q tests/test_kivy_display_scale.py tests/css/test_geometry_handoff.py tests/test_grid_native_density_parity.py tests/test_grid_flow_blueprint_reuse.py tests/test_native_layout_snapshot.py tests/test_css_inset_border_geometry.py tests/test_qt_kivy_native_raster_edge_contract.py
          else
            python -m pytest -q tests/test_kivy_display_scale.py tests/css/test_geometry_handoff.py tests/test_grid_native_density_parity.py tests/test_grid_flow_blueprint_reuse.py tests/test_native_layout_snapshot.py tests/test_css_inset_border_geometry.py tests/test_qt_kivy_native_raster_edge_contract.py
          fi

      - name: Validate first-frame Kivy viewport synchronization on macOS
        if: runner.os == 'macOS'
        run: python -m pytest -q tests/test_kivy_window_resize_coalescing.py

  linux-native:
    name: Native Kivy 1x/2x simulated Retina / SDL2 + Xvfb
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native OpenGL/Xvfb runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libmtdev1 libgl1 libx11-6 libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 fonts-dejavu-core
          python -m pip install -e '.[kivy,pyside6]' pytest Pillow
      - name: Report actual SDL2 window ratio (this is not a Retina monitor)
        env:
          KIVY_NO_ARGS: '1'
          KIVY_NO_FILELOG: '1'
        run: |
          xvfb-run -a python - <<'PY'
          import json
          from kivy.core.window import Window
          from kivy.metrics import Metrics
          from psx.renderers.kivy.cinnamon_kivy_display_scale import KivyDisplayScale
          observed = KivyDisplayScale.from_window(Window)
          print(json.dumps({
              "window_scale": observed.snapshot(),
              "density": Metrics.density,
              "fontscale": Metrics.fontscale,
          }, sort_keys=True))
          assert observed.uniform > 0
          PY
      - name: Validate first-frame Kivy viewport synchronization under Xvfb
        env:
          KIVY_NO_ARGS: '1'
          KIVY_NO_FILELOG: '1'
        run: xvfb-run -a python -m pytest -q tests/test_kivy_window_resize_coalescing.py
      - name: Validate SDL2 CSS px and simulated 2x Retina native projection
        env:
          KIVY_NO_ARGS: '1'
          KIVY_NO_FILELOG: '1'
        run: |
          xvfb-run -a python -m pytest -q tests/test_kivy_native_layout.py -k "simulated_retina_css_px_preserves_font_padding_and_height or retina_nested_grid_dashboard_css_gap_padding_and_height or retina_dashboard_header_and_activity_dates_stay_inside_content or retina_sidebar_buttons_use_css_height_spacing_and_padding"
          xvfb-run -a python -m pytest -q tests/test_kivy_renderer.py -k "css_px_font_matches_cinnamon_at_all_density_settings or uniform_border_has_exactly_one_paint_path_on_retina or css_button_without_background_retains_native_theme_and_padding"
          # Buttons with color-only CSS must retain their themed skin and 6px
          # user-agent padding; only authored background CSS replaces it.
          xvfb-run -a python -m pytest -q tests/test_kivy_button_intrinsic_skin.py

      - name: Capture and compare native Qt/QSS and Kivy/SDL2 CSS surfaces
        env:
          KIVY_NO_ARGS: '1'
          KIVY_NO_FILELOG: '1'
        run: |
          mkdir -p qt-kivy-native-visual
          xvfb-run -a python -m tests.certification.qt_kivy_css_native_raster --output qt-kivy-native-visual
      - name: Compare native Qt and Kivy text metrics from the same font file
        env:
          KIVY_NO_ARGS: '1'
          KIVY_NO_FILELOG: '1'
          QT_QPA_PLATFORM: 'offscreen'
          PSX_QT_KIVY_FONT_METRICS_OUTPUT: qt-kivy-native-visual/font-metrics
        run: |
          xvfb-run -a python -m pytest -q tests/certification/qt_kivy_native_text_metrics.py
      - name: Upload native raster comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-kivy-css-native-raster
          path: qt-kivy-native-visual/
