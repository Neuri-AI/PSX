name: Kivy Retina CSS parity

on:
  push:
    branches:
      - fixes/psx-issues
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kivy-retina-css:
    name: Kivy Retina CSS / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Cocoa / SDL Kivy runtime and tests
        run: python -m pip install -e '.[kivy]' pytest Pillow
      - name: Report live Kivy window and display metrics
        env:
          KIVY_NO_ARGS: '1'
          KIVY_NO_FILELOG: '1'
        run: |
          python - <<'PY'
          import json
          from kivy.core.window import Window
          from kivy.metrics import Metrics
          from psx.sfle.kivy_display_scale import KivyDisplayScale
          observed = KivyDisplayScale.from_window(Window)
          print(json.dumps({
              "window_scale": observed.snapshot(),
              "density": Metrics.density,
              "fontscale": Metrics.fontscale,
          }, sort_keys=True))
          assert observed.uniform > 0
          PY
      - name: Prove Retina conversion and authored CSS without physical display changes
        env:
          KIVY_NO_ARGS: '1'
          KIVY_NO_FILELOG: '1'
        run: |
          python -m pytest -q tests/test_kivy_display_scale.py tests/css/test_geometry_handoff.py
          python -m pytest -q tests/test_kivy_native_layout.py -k simulated_retina_css_px_preserves_font_padding_and_height
          python -m pytest -q tests/test_kivy_renderer.py -k css_px_font_matches_cinnamon_at_all_density_settings
