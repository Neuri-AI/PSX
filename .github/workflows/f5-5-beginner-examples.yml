name: F5.5 beginner example behavior

on:
  pull_request:
    branches: [develop]
    paths:
      - "examples/f5_5_beginner/**"
      - "psx/**"
      - ".github/workflows/f5-5-beginner-examples.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source distribution
        run: python -m pip install -e .
      - name: Execute published examples
        run: |
          python examples/f5_5_beginner/hello_world.py
          python examples/f5_5_beginner/counter.py
      - name: Verify observable behavior
        working-directory: examples/f5_5_beginner
        run: python -m unittest -v test_examples
