name: Pydux coordinated hot reload regression
on:
  push:
    branches: [fixes/psx-issues]
jobs:
  pydux-hot-reload:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_pydux_reload_integration.py
