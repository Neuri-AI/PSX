name: P0 memory soak

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: "Mount/update/unmount cycles per backend"
        type: choice
        required: true
        default: "1000"
        options:
          - "1000"
          - "5000"
          - "10000"
  push:
    branches: [develop]
    paths:
      - "scripts/p0_memory_soak.py"
      - "tests/test_p0_memory_soak_probes.py"
      - "tests/test_p0_memory_soak_report.py"
      - "scripts/p0_memory_soak_report.py"
      - ".github/workflows/p0-memory-soak.yml"

permissions:
  contents: read

concurrency:
  group: p0-memory-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-soak:
    name: Memory soak ${{ matrix.backend }} Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        backend: [pyside6, tkinter, kivy]
    env:
      QT_QPA_PLATFORM: offscreen
      KIVY_NO_FILELOG: "1"
      KIVY_NO_ARGS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Native toolkit host libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-tk libegl1 libgl1 \
            libgl1-mesa-dri libxkbcommon-x11-0 libdbus-1-3 libmtdev1 \
            libx11-6 libxext6 libxrender1 libxrandr2 libxcursor1 \
            libxi6 libsm6 libice6 libasound2-dev
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,${{ matrix.backend == 'pyside6' && 'pyside6' || matrix.backend == 'kivy' && 'kivy' || 'dev' }}]"
          python -m pip install psutil
      - name: Validate memory instrumentation
        run: |
          python -m pytest -q tests/test_p0_memory_soak_probes.py tests/test_p0_memory_soak_report.py
      - name: Run isolated native backend soak
        run: |
          mkdir -p artifacts
          xvfb-run -a python scripts/p0_memory_soak.py \
            --backend "${{ matrix.backend }}" \
            --cycles "${{ github.event.inputs.cycles || '1000' }}" \
            --interval 250 \
            --json-out "artifacts/${{ matrix.backend }}-memory.json"
      - name: Summarize memory trends
        if: always()
        run: |
          if [ -f "artifacts/${{ matrix.backend }}-memory.json" ]; then
            python scripts/p0_memory_soak_report.py \
              "artifacts/${{ matrix.backend }}-memory.json" \
              --summary-out "artifacts/${{ matrix.backend }}-summary.json" \
              --markdown-out "artifacts/${{ matrix.backend }}-summary.md"
            cat "artifacts/${{ matrix.backend }}-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload raw resource measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-soak-${{ matrix.backend }}-${{ github.run_id }}
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30
