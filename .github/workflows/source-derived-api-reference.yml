name: Source-derived API reference refresh

on:
  push:
    paths:
      - ".github/workflows/source-derived-api-reference.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.ref == 'refs/heads/feature/cross-platform-certification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install inspected source
        run: python -m pip install -e .
      - name: Regenerate current source contracts
        run: python -m scripts.docs.generate_g4_reference --write
      - name: Commit source-derived documentation
        run: |
          git add docs/public/reference/generated-contracts.mdx
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(public): refresh source-derived component and API contracts"
            git push origin HEAD:feature/cross-platform-certification
          else
            echo "Generated reference is already current"
          fi
