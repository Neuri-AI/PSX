name: SFLE native wheels and frozen fallback

on:
  pull_request:
    paths:
      - "psx/sfle/**"
      - "rust/sfle-core/**"
      - "tests/interop/sfle_frozen_probe.py"
      - "tests/interop/test_sfle_f2_native_wheel.py"
      - ".github/workflows/sfle-native-matrix.yml"
  push:
    branches: [main]
    paths:
      - "psx/sfle/**"
      - "rust/sfle-core/**"
      - "tests/interop/sfle_frozen_probe.py"
      - "tests/interop/test_sfle_f2_native_wheel.py"
      - ".github/workflows/sfle-native-matrix.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wheel-and-frozen:
    name: "SFLE wheel/frozen ${{ matrix.os }} Python 3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-2022", "macos-15-intel", "macos-15"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Identify actual CI platform and CPU
        run: |
          python -c "import sys,platform,sysconfig; print('SFLE_RUNNER', platform.platform(),platform.machine(),sysconfig.get_platform(),sys.version)"
          rustc -vV
      - name: Install Python fallback, build, test and freeze dependencies
        run: python -m pip install -e . pytest "maturin>=1.8,<2" "pyinstaller>=6.9"
      - name: Build real native PyO3 wheel on this runner
        run: maturin build --release --manifest-path rust/sfle-core/Cargo.toml --out wheelhouse
      - name: Install and inspect native wheel
        run: |
          python -m pip install --no-deps --find-links wheelhouse "psx-sfle-native==0.1.0"
          python -c "import _sfle_native as native; assert native.schema_version()==1; print('SFLE_NATIVE_LIBRARY',native.__file__)"
      - name: Verify ABI, native primary and exact accepted corpus against Python
        run: python -m pytest -q tests/interop/test_sfle_f2_native_wheel.py
      - name: Freeze an executable with Rust native extension bundled
        run: |
          pyinstaller --noconfirm --clean --onefile --name sfle-native-probe --hidden-import _sfle_native --distpath dist-native --workpath build-native tests/interop/sfle_frozen_probe.py
          EXT=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then EXT=".exe"; fi
          "./dist-native/sfle-native-probe${EXT}" rust
      - name: Remove installed native wheel; assert load-time Python fallback
        run: |
          python -m pip uninstall -y psx-sfle-native
          python -c "import importlib.util; assert importlib.util.find_spec('_sfle_native') is None"
          python -c "from psx.sfle.backend import load_layout_engine; assert load_layout_engine().backend_name=='python'"
      - name: Verify previous frozen native exe does not depend on installed wheel
        run: |
          EXT=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then EXT=".exe"; fi
          "./dist-native/sfle-native-probe${EXT}" rust
      - name: Freeze a distinct Python-only executable without the extension
        run: |
          pyinstaller --noconfirm --clean --onefile --name sfle-python-probe --distpath dist-python --workpath build-python tests/interop/sfle_frozen_probe.py
          EXT=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then EXT=".exe"; fi
          "./dist-python/sfle-python-probe${EXT}" python
      - name: Preserve installable native wheel as a verifiable build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfle-native-wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
