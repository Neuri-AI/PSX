name: F3 G1 contract certification

on:
  pull_request:
    branches: [develop]
    paths:
      - "psx/core/**"
      - "psx/markup/**"
      - "tests/test_f3_flex_contract.py"
      - "tests/test_f3_g1_item_metadata.py"
      - "tests/test_core.py"
      - "tests/test_component_contracts.py"
      - "tests/test_component_registry.py"
      - "tests/test_markup*.py"
      - "tests/test_hooks_scheduler.py"
      - "tests/test_renderer_adapters.py"
      - "pyproject.toml"
      - ".github/workflows/f3-g1-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "f3-g1-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  g1-contract:
    name: G1 Builder/Markup/normalization Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml supports >=3.10,<3.14; do not falsely certify 3.14.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
      - run: python -m pip install -e . pytest
      - name: Complete F3-G1 positive and adversarial core contract suite
        run: |
          python -m pytest -q \
            tests/test_f3_flex_contract.py \
            tests/test_f3_g1_item_metadata.py \
            tests/test_component_contracts.py \
            tests/test_component_registry.py \
            tests/test_markup.py \
            tests/test_markup_registry.py \
            tests/test_core.py \
            tests/test_hooks_scheduler.py \
            tests/test_renderer_adapters.py
      - name: Certify no GUI imports are required for Flex normalization
        run: |
          python - <<'PY'
          import sys
          from psx import Flex, Text
          from psx.core.layout_tree import normalize_flex_tree
          from psx.core.registry import builtin_component_registry
          from psx.core.props import FLEX_ITEM_PROPS
          tree = Flex(Text("ok", layout_width="50%", flex_grow=1))
          assert normalize_flex_tree(tree).children[0].source is tree.children[0]
          assert {"flex_grow", "layout_width", "layout_margin_top"} <= FLEX_ITEM_PROPS
          assert "Flex" in builtin_component_registry().snapshot()
          assert not any(name in sys.modules for name in (
              "PySide6", "PyQt5", "PyQt6", "kivy", "tkinter"))
          print("G1 declaration/normalization independent of GUI backend.")
          PY

  g1-verdict:
    name: G1 complete contract certification verdict
    if: always()
    needs: [g1-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Do not certify if any supported Python fails
        env:
          RESULT: "${{ needs.g1-contract.result }}"
        run: |
          test "$RESULT" = success || {
            echo "G1 cannot be certified: matrix result $RESULT" >&2
            exit 1
          }
          echo "G1 core/markup/normalizer + adversarial suite certified on every supported Python version."
