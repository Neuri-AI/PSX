name: Integrated development reload certification
on:
  push:
    branches: [feature/intelligent-hot-reload]
    paths:
      - 'tests/test_native_coordinated_refresh.py'
      - 'tests/test_component_remount.py'
      - 'tests/test_coordinated_refresh.py'
      - 'tests/test_ci_impact.py'
      - 'scripts/ci/impact.py'
      - 'psx/devtools/**'
      - '.github/workflows/development-reload-certification.yml'
  workflow_dispatch:
jobs:
  integrated-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Neuri-AI/Pydux
          ref: d4495be4914ab38255d5871d3ade45422003015c
          path: partner-pydux
      - uses: actions/checkout@v4
        with:
          repository: Neuri-AI/qyro
          ref: 00a2814d2e1e1bcbf2051ffe6a6be317d8b439f6
          path: partner-qyro
      - uses: actions/checkout@v4
        with:
          repository: Neuri-AI/Velto-CLI
          ref: 17c6c1733a47014f3f7661c4072742a4c7c743dc
          path: partner-cli
      - name: Install complete development dependencies
        run: |
          python -m pip install pytest pandas cryptography rich semver requests prompt-toolkit questionary pillow pyinstaller
          python -m pip install -e . --no-deps
          python -m pip install -e partner-pydux --no-deps
          python -m pip install -e partner-qyro --no-deps
          python -m pip install -e partner-cli --no-deps
      - name: Compatible refresh and targeted remount
        run: python -m pytest -q tests/test_coordinated_refresh.py tests/test_component_remount.py tests/test_ci_impact.py
      - name: Pydux JSON state restore and subscriptions
        run: cd partner-pydux && python -m pytest -q tests/test_development_state_snapshot.py
      - name: Qyro receiver, UI-thread coordination, frozen guards and state recovery
        run: cd partner-qyro && python -m pytest -q tests/test_development_settings.py tests/test_development_changes.py tests/test_development_refresh_dispatch.py tests/test_development_state_recovery.py tests/test_development_restart_requests.py tests/test_development_restart_state.py tests/test_coordinated_context_refresh.py
      - name: CLI authenticated restart, child lifecycle and process recovery
        run: cd partner-cli && python -m pytest -q tests/adapters/process/test_development_coordinator.py tests/integration/test_development_coordination.py
