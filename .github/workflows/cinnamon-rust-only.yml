name: Cinnamon architecture - Rust without Python fallback

on:
  push:
    branches: [feature/semantic-inline-fragments]
    paths:
      - 'psx/layout/**'
      - 'psx/renderers/**'
      - 'tests/architecture/**'
      - 'rust/sfle-core/**'
      - '.github/workflows/cinnamon-rust-only.yml'
  pull_request:
    paths:
      - 'psx/layout/**'
      - 'psx/renderers/**'
      - 'tests/architecture/**'
      - 'rust/sfle-core/**'
      - '.github/workflows/cinnamon-rust-only.yml'

permissions:
  contents: read

jobs:
  rust-without-fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      KIVY_NO_ARGS: '1'
      KIVY_NO_FILELOG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GUI import dependencies and native wheel builder
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-tk libmtdev1 libgl1 libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install -e '.[pyside6,kivy]' pytest 'maturin>=1.8,<2'
      - name: Build and install REAL Rust Cinnamon wheel
        run: |
          maturin build --release --manifest-path rust/sfle-core/Cargo.toml --out /tmp/cinnamon-rust-only
          python -m pip install --no-deps /tmp/cinnamon-rust-only/*.whl
          python -c "import _sfle_native as n; assert n.schema_version()==1"
      - name: Physically remove fallback and certify Rust independently
        run: |
          set -euo pipefail
          test ! -e psx/sfle
          mv psx/layout/fallback /tmp/cinnamon-fallback-removed
          test ! -e psx/layout/fallback
          python -m pytest -q -rs tests/architecture/test_rust_only_layout.py
