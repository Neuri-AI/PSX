name: Cross-platform native reload certification
on:
  push:
    branches: [feature/intelligent-hot-reload]
    paths:
      - 'tests/test_native_event_loop_process.py'
      - 'tests/test_native_supervised_restart.py'
      - 'tests/certification/native_supervised_child.py'
      - 'tests/certification/native_event_loop_child.py'
      - 'tests/test_native_refresh_resource_soak.py'
      - 'tests/test_native_coordinated_refresh.py'
      - '.github/workflows/cross-platform-native-reload.yml'
  workflow_dispatch:
jobs:
  native-toolkit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        backend: [qt, tk, kivy]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    env:
      PSX_GRID_BACKEND: ${{ matrix.backend }}
      PSX_QT_BINDING: pyside6
      QT_QPA_PLATFORM: offscreen
      KIVY_NO_ARGS: '1'
      KIVY_NO_CONSOLELOG: '1'
      PSX_MEMORY_REPORT_DIR: native-reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.os == 'windows-latest' && matrix.backend == 'tk' && '3.11' || '3.12' }}
      - uses: actions/checkout@v4
        with:
          repository: Neuri-AI/Velto-CLI
          ref: 75590348b3edb25d0d004bb11e3e2d0d127e5577
          path: partner-cli
      - name: Prepare Linux display and native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth python3-tk libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libmtdev1 libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-ttf-2.0-0
      - name: Install native toolkit and diagnostics
        shell: bash
        run: |
          python -m pip install pytest pytest-timeout psutil
          python -m pip install -e '.[pyside6,kivy]'
          python -m pip install -e partner-cli --no-deps
      - name: Native process and refresh certification on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q --timeout=300 tests/test_native_event_loop_process.py tests/test_native_supervised_restart.py tests/test_native_coordinated_refresh.py tests/test_native_refresh_resource_soak.py
      - name: Native process and refresh certification on Windows and macOS
        if: runner.os != 'Linux'
        run: python -m pytest -q --timeout=300 tests/test_native_event_loop_process.py tests/test_native_supervised_restart.py tests/test_native_coordinated_refresh.py tests/test_native_refresh_resource_soak.py
      - name: Upload native memory observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-memory-${{ matrix.os }}-${{ matrix.backend }}
          path: native-reports/
          if-no-files-found: warn
