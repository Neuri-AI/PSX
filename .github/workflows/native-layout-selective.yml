  native:
    name: Native layout native wheel and Python fallback ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-2022", "macos-15-intel", "macos-15"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python build and test dependencies
        run: python -m pip install -e . pytest "maturin>=1.8,<2"
      - name: Build installable wheel on actual runner
        run: maturin build --release --manifest-path rust/sfle-core/Cargo.toml --out wheelhouse
      - name: Install wheel and assert Rust primary ABI
        run: |
          python -m pip install --no-deps --find-links wheelhouse "psx-sfle-native==0.1.0"
          python -c "import _sfle_native as native; assert native.schema_version()==1"
      - name: Verify Rust/Python parity of installed wheel
        run: python -m pytest -q tests/interop/test_sfle_native_wheel.py
      - name: Measure native Aqua styled Tk resize with Cinnamon Rust
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          python benchmarks/grid_resize_interactive.py --adapter tk --engine rust --cards 6 --cycles 20 --warmup 3 --styled > macos-styled-tk-resize.json
          python - <<'PY'
          import json
          import tkinter
          from pathlib import Path
          row = json.loads(Path("macos-styled-tk-resize.json").read_text())[0]
          assert row["engine"] == "rust" and row["adapter"] == "tk"
          print("Native Aqua Tcl/Tk:", tkinter.TkVersion)
          print("Event-to-commit mean:", row["mean_event_to_commit_ms"], "ms")
          print("Event-to-commit p95:", row["p95_event_to_commit_ms"], "ms")
          print("Request-to-settled mean:", row["mean_request_to_loop_settled_ms"], "ms")
          print("CPU per resize:", row["mean_request_to_loop_settled_cpu_ms"], "ms")
          print("60Hz mean budget met:", row["mean_request_to_loop_settled_ms"] <= 16.0)
          print("Compositor frame timestamps:", row["presentation_feedback_supported"])
          PY
          python -m cProfile -s cumtime benchmarks/grid_resize_interactive.py --adapter tk --engine rust --cards 6 --cycles 10 --warmup 2 --styled > macos-styled-tk-profile.txt
          sed -n '/function calls in/,+60p' macos-styled-tk-profile.txt
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: native-aqua-tk-resize-${{ matrix.os }}
          path: |
            macos-styled-tk-resize.json
            macos-styled-tk-profile.txt
          if-no-files-found: ignore
      - name: Uninstall wheel and prove load-time Python fallback
        run: |
          python -m pip uninstall -y psx-sfle-native
          python -c "import importlib.util; assert importlib.util.find_spec('_sfle_native') is None"
          python -c "from psx.sfle.backend import load_layout_engine; assert load_layout_engine().backend_name=='python'"


  legacy:
    name: Native layout G4 no-Row-or-Column final API gate
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Reject shipped legacy layout identifiers and markup
        run: python scripts/ci/legacy_layout_inventory.py --check --out legacy-layout-gate.json
      - name: Reject any remaining public legacy layout API
        run: |
          python - <<'PY'
          import psx
          from psx.core.registry import builtin_component_registry
          registry = builtin_component_registry()
          for name in ("Row", "Column"):
              assert not registry.contains(name), f"{name} still in public registry"
              assert name not in psx.__all__, f"{name} still exported"
              assert not hasattr(psx, name), f"{name} still exposed"
          print("Legacy layout API absent as required for Native layout G4/G5.")
          PY

  public-behavior-final:
    name: Native layout public behavior evidence aggregate
    needs: [changes, core, qt-parity, kivy, tkinter, headless]
    if: >-
      needs.changes.outputs.core == 'true' &&
      needs.changes.outputs.qt == 'true' &&
      needs.changes.outputs.kivy == 'true' &&
      needs.changes.outputs.tkinter == 'true' &&
      needs.changes.outputs.headless == 'true' &&
      needs.core.result == 'success' &&
      needs.qt-parity.result == 'success' &&
      needs.kivy.result == 'success' &&
      needs.tkinter.result == 'success' &&
      needs.headless.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: public-*
          path: public-artifacts
      - name: Aggregate and validate every public behavior receipt from this CI run
        shell: bash
        run: |
          set -euo pipefail
          required=(
            public-behavior-inventory
            public-native-qt-receipts-pyside6
            public-native-qt-receipts-pyqt6
            public-native-qt-receipts-pyqt5
            public-native-qt-receipts-pyside2
            public-native-tk-receipts
            public-native-kivy-receipts
            public-native-headless-receipts
          )
          files=()
          for artifact in "${required[@]}"; do
            dir="public-artifacts/$artifact"
            test -d "$dir" || { echo "Missing native artifact: $artifact"; exit 1; }
            mapfile -t candidates < <(find "$dir" -maxdepth 1 -type f -name '*-receipts.json')
            test "${#candidates[@]}" -eq 1 || { echo "Expected one receipt manifest: $artifact"; exit 1; }
            files+=(--receipt-file "${candidates[0]}")
          done
          python -m tests.certification.public_behavior_census \
            --out public-behavior-final-inventory.json \
            --sha "${{ github.sha }}" \
            --require-contract-component Grid \
            --require-contract-component GridItem \
            --require-native-component Grid \
            --require-native-component GridItem \
            --require-semantic-flow \
            "${files[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-public-behavior-inventory
          path: |
            public-behavior-final-inventory.json
            public-behavior-final-inventory-final-report.json
          if-no-files-found: warn

  summary:
    name: Native layout required CI conclusion
    needs: [changes, selector-tests, core, sfle, rust, chromium, qt, qt-parity, kivy, tkinter, tkinter-aqua, headless, native, legacy, public-behavior-final]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Ensure every selected job succeeded
        env:
          CHANGE_RESULT: "${{ needs.changes.result }}"
          SELECTED: "${{ needs.changes.outputs.selected }}"
          FULL: "${{ needs.changes.outputs.full }}"
          RESULTS: "${{ toJSON(needs) }}"
        run: |
          python - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          if os.environ["CHANGE_RESULT"] != "success":
              sys.exit("Change router did not succeed; CI cannot be certified.")
          selected = {x for x in os.environ["SELECTED"].split(",") if x}
          if selected:
              # Retirement is universal: a backend-only change can reintroduce
              # a forbidden native layout adapter, so G4 runs for ALL code.
              selected.add("legacy")
          aliases = {"router": "selector-tests"}
          failures = []
          for suite in selected:
              job = aliases.get(suite, suite)
              outcome = needs.get(job, {}).get("result")
              if outcome != "success":
                  failures.append(f"{job}={outcome}")
          # Qt parity is a required four-binding matrix, not an optional
          # informational job. GitHub sets its aggregate result to failure if
          # any PySide6/PyQt6/PyQt5/PySide2 matrix cell fails or is cancelled.
          if "qt" in selected:
              parity = needs.get("qt-parity", {}).get("result")
              if parity != "success":
                  failures.append(f"qt-parity={parity}")
          # The Tk Linux test is not a substitute for mounted macOS Aqua.
          # A cancelled/queued/not-executed Aqua check must not allow the
          # mandatory conclusion to turn green.
          if "tkinter" in selected:
              aqua = needs.get("tkinter-aqua", {}).get("result")
              if aqua != "success":
                  failures.append(f"tkinter-aqua={aqua}")
          if {"core", "qt", "kivy", "tkinter", "headless"}.issubset(selected):
              final = needs.get("public-behavior-final", {}).get("result")
              if final != "success":
                  failures.append(f"public-behavior-final={final}")
          if failures:
              sys.exit("Mandatory selected jobs not successful: " + ", ".join(failures))
          print("Native layout selected suites GREEN:", ", ".join(sorted(selected)) or "(none)")
          PY
