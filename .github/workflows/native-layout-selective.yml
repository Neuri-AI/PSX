          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth python3-tk
      # Pillow supplies arbitrary scaling/cropping for the optional Tk Image
      # renderer; plain Tk PhotoImage still supports natural-size PNG.
      - run: python -m pip install -e . pytest Pillow
      - run: xvfb-run -a python -m pytest -q tests/test_tkinter_renderer.py tests/test_tkinter_native_layout.py tests/test_tkinter_external_native_ports.py tests/sfle/test_grid_native_measurement.py tests/sfle/test_grid_native_commit.py --junitxml=native-layout-tk.xml
