name: Native layout selective validation

on:
  push:
    branches: [fixes/psx-issues]
    paths:
      - "psx/sfle/**"
      - "psx/renderers/kivy/kivy.py"
      - "psx/renderers/components/text.py"
      - "tests/test_kivy_renderer.py"
      - "tests/test_mounted_grid_native_renderers.py"
      - "psx/renderers/qt/pyqt.py"
      - "psx/renderers/tkinter/tkinter.py"
      - "tests/test_flow_linear_complexity.py"
      - "tests/test_native_structural_snapshot_reuse.py"
      - "tests/test_native_geometry_write_suppression.py"
      - "tests/test_kivy_native_layout.py"
      - "tests/sfle/test_nested_block_flex_layout.py"
      - ".github/workflows/native-layout-selective.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  changes:
    name: Native layout classify full PR diff
    runs-on: ubuntu-latest
    outputs:
      router: "${{ steps.select.outputs.router }}"
      core: "${{ steps.select.outputs.core }}"
      sfle: "${{ steps.select.outputs.sfle }}"
      rust: "${{ steps.select.outputs.rust }}"
      chromium: "${{ steps.select.outputs.chromium }}"
      qt: "${{ steps.select.outputs.qt }}"
      kivy: "${{ steps.select.outputs.kivy }}"
      tkinter: "${{ steps.select.outputs.tkinter }}"
      headless: "${{ steps.select.outputs.headless }}"
      native: "${{ steps.select.outputs.native }}"
      legacy: "${{ steps.select.outputs.legacy }}"
      full: "${{ steps.select.outputs.full }}"
      docs_only: "${{ steps.select.outputs.docs_only }}"
      selected: "${{ steps.select.outputs.selected }}"
    steps:
      - uses: actions/checkout@v4
      - name: Read complete changed paths (including rename sources)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let changed = [];
            if (context.eventName === 'pull_request') {
              try {
                const common = {owner: context.repo.owner, repo: context.repo.repo};
                const before = context.payload.before;
                const after = context.payload.after;
                const pr = context.issue.number;
                let verifiedDelta = false;
                // Verified docs-only synchronizations skip all tests regardless
                // of the previous CI status (including cancelled/failed).
                if (context.payload.action === 'synchronize' && before && after) {
                  const diff = await github.rest.repos.compareCommits({
                    ...common, base: before, head: after, per_page: 100,
                  });
                  const entries = diff.data.files || [];
                  const safeDelta = diff.data.total_commits <= 250 &&
                    entries.length > 0 && entries.length < 300;
                  if (safeDelta) {
                    const deltaPaths = entries.flatMap(file =>
                      [file.filename, file.previous_filename].filter(Boolean));
                    const isDocs = path => path === 'README.md' ||
                      path.startsWith('docs/') ||
                      (path.endsWith('.md') && !path.startsWith('.github/'));
                    const docsOnly = deltaPaths.every(isDocs);
                    if (docsOnly) {
                      changed = deltaPaths;
                      verifiedDelta = true;
                      core.info('Verified docs-only PR update: zero tests, ' +
                        'even if previous CI did not finish.');
                    } else {
                      // A passing docs-only router is not a passing product CI.
                      // Reuse a code delta only when the prior HEAD passed tests.
                      const past = await github.rest.actions.listWorkflowRunsForRepo({
                        ...common, head_sha: before, event: 'pull_request', per_page: 100,
                      });
                      const previous = (past.data.workflow_runs || []).find(run =>
                        run.name === 'Native layout selective validation' &&
                        run.head_sha === before &&
                        run.status === 'completed' &&
                        run.conclusion === 'success' &&
                        (run.pull_requests || []).some(p => p.number === pr));
                      if (previous) {
                        const pastJobs = await github.paginate(
                          github.rest.actions.listJobsForWorkflowRun, {
                            ...common, run_id: previous.id, per_page: 100,
                          });
                        const hasSuccessfulProductJob = pastJobs.some(job =>
                          job.conclusion === 'success' &&
                          /^Native layout (?:core and registry|SFLE geometry contracts|Rust and Python differential|browser geometry oracle|Qt native components|Qt SFLE parity|Kivy native components|Tkinter native components|deterministic Headless|native wheel and Python fallback)/.test(job.name));
                        if (hasSuccessfulProductJob) {
                          changed = deltaPaths;
                          verifiedDelta = true;
                          core.info('Previously certified HEAD ' + before +
                            ': revalidating only changes through ' + after);
                        }
                      }
                    }
                  }
                }
                if (!verifiedDelta) {
                  // New PR, previous failure, ambiguous delta or missing
                  // predecessor: evaluate ALL cumulative changed paths.
                  const files = await github.paginate(github.rest.pulls.listFiles, {
                    ...common, pull_number: pr, per_page: 100,
                  });
                  if (files.length >= 3000) {
                    core.warning('PR exceeds complete file inventory; select all checks.');
                  } else {
                    changed = files.flatMap(file =>
                      [file.filename, file.previous_filename].filter(Boolean));
                  }
                }
              } catch (error) {
                core.warning('Diff/provenance unavailable: full testing. ' + error.message);
                changed = [];
              }
            }
            fs.writeFileSync('native-layout-changed-files.json', JSON.stringify(changed));
      - name: Select impacted suites; fail open on missing diff
        id: select
        env:
          NATIVE_LAYOUT_FULL: "${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}"
        shell: bash
        run: |
          args=()
          if [[ "$NATIVE_LAYOUT_FULL" == "true" ]]; then args+=(--full); fi
          python scripts/ci/impact.py --changed-json native-layout-changed-files.json --github-output "$GITHUB_OUTPUT" "${args[@]}"
      - name: Explain CI selection
        run: |
          echo "Selected checks: ${{ steps.select.outputs.selected }}"
          echo "Docs-only: ${{ steps.select.outputs.docs_only }}"
          echo "Full certification: ${{ steps.select.outputs.full }}"

  selector-tests:
    name: Native layout change-router regression
    needs: changes
    if: needs.changes.outputs.router == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify zero-doc and dependency-aware routing
        run: python -m unittest discover -s tests -p test_ci_impact.py -v

  core:
    name: Native layout core and registry
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_disposed_state_payloads.py
      - name: Verify watcher and delayed refresh lifecycle cleanup
        run: python -m pytest -q tests/test_devtools.py
      - name: Verify headless resource baseline instrument
        run: python -m pytest -q tests/test_resource_baseline.py
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install "maturin>=1.8,<2"
      - run: maturin build --release --manifest-path rust/sfle-core/Cargo.toml --out wheelhouse
      - run: python -m pip install --no-deps --find-links wheelhouse "psx-sfle-native==0.1.0"
      - run: python -m pytest -q tests/test_reconciler_ownership_lifecycle.py
      - name: Capture Rust and Python resource baselines
        run: python benchmarks/resource_baseline.py --nodes 16 --cycles 100 --warmup 10 --engine both --output resource-baseline.json > /dev/null
      - name: Capture prolonged dual-engine CPU and memory observations
        run: python benchmarks/resource_baseline.py --nodes 16 --cycles 400 --warmup 30 --engine both --output resource-baseline-soak.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: headless-resource-soak
          path: resource-baseline-soak.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: headless-resource-baseline
          path: resource-baseline.json
          if-no-files-found: error
      - run: python -m pytest -q tests/css/test_cursor_auto_margin.py tests/css/test_cursor_shape_mapping.py tests/css/test_properties.py tests/css/test_parser_and_cascade.py tests/css/test_cache.py tests/css/test_visual_values.py tests/css/test_effects.py tests/css/test_property_catalog.py tests/css/test_catalog.py tests/css/test_tree.py tests/css/test_sources.py tests/css/test_context.py tests/css/test_geometry_handoff.py tests/css/test_box_flow_geometry.py tests/css/test_native_paint.py tests/test_markup_css_binding.py tests/test_component_css_inheritance.py tests/test_css_markup_census.py tests/test_core.py tests/test_spacer.py tests/test_divider.py tests/test_markup_transform.py tests/test_markup_inline_text_coalescing.py tests/test_html_form_input_events.py tests/test_html_form_content.py tests/test_html_radio_grouping.py tests/test_html_select_options.py tests/test_expressive_markup_syntax.py tests/test_expressive_conditional_rendering.py tests/test_declarative_list_rendering.py tests/test_arrow_callback_rendering.py tests/test_expressive_composition_security.py tests/test_ref_m0_characterization.py tests/test_component_contracts.py tests/test_component_registry.py tests/test_lowercase_markup_aliases.py tests/test_markup_registry.py tests/test_markup.py tests/test_hooks_scheduler.py tests/test_component_lexical_runtime.py tests/test_renderer_adapters.py tests/test_source_naming_conventions.py tests/test_legacy_layout_inventory.py tests/test_scroll_offsets.py tests/test_scroll_events.py tests/test_scroll_transactions.py tests/test_scroll_operation_receipts.py tests/test_native_scroll_hosts.py tests/test_flex_layout_contract.py tests/test_grid_contract.py tests/test_flex_item_metadata.py tests/test_native_layout_snapshot.py tests/test_viewport_lengths.py tests/test_p1_canonical_box_style.py tests/test_native_component_capabilities.py tests/test_native_component_matrix.py tests/test_native_operation_contracts.py tests/test_native_external_ownership_contracts.py tests/test_native_measurement_invalidation.py tests/test_layout_change_effects.py tests/test_incremental_result_reuse.py tests/test_native_invalidation_receipts.py tests/test_native_intrinsic_cache.py tests/test_native_geometry_write_suppression.py tests/test_native_resource_invalidation.py tests/test_external_native_geometry_ports.py tests/test_width_dependent_intrinsic_measurement.py tests/test_native_pixel_scale.py tests/test_native_geometry_precision.py tests/test_native_component_integration.py tests/test_native_acceptance_receipts.py tests/test_component_family_policy.py tests/test_headless_native_layout.py
      - name: Verify source-derived public behavior inventory and receipt integrity
        run: python -m pytest -q tests/test_public_behavior_census.py tests/test_public_contract_census.py tests/test_public_property_validation.py tests/test_grid_contract.py tests/test_lowercase_markup_aliases.py tests/test_css_markup_census.py --junitxml=public-behavior-core.xml
      - name: Export pending public behavior certification census
        run: |
          python -m tests.certification.public_behavior_census --out public-behavior-inventory.json --junit public-behavior-core.xml --sha "${{ github.sha }}" --environment "ubuntu-latest-python-3.12"
      - uses: actions/upload-artifact@v4
        with:
          name: public-behavior-inventory
          path: |
            public-behavior-inventory.json
            public-behavior-inventory-receipts.json
            public-behavior-core.xml
          if-no-files-found: error
      - name: Record active legacy-layout migration inventory
        run: python scripts/ci/legacy_layout_inventory.py --out legacy-layout-inventory.json > legacy-layout-inventory-log.json
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-layout-migration-inventory
          path: legacy-layout-inventory.json


  sfle:
    name: Native layout SFLE geometry contracts
    needs: changes
    if: needs.changes.outputs.sfle == 'true'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt offscreen libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install -e '.[pyside6]' pytest
      - run: python -m pytest -q -rs tests/sfle

  rust:
    name: Native layout Rust and Python differential
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/sfle-core/Cargo.toml --all-targets
      - run: python -m pip install -e . pytest
      - name: Rust/Python capability and geometry agreement
        run: python -m pytest -q tests/interop/test_sfle_differential.py tests/interop/test_sfle_capability_parity.py tests/interop/test_sfle_deferral_boundaries.py tests/sfle/test_grid_math.py

  chromium:
    name: Native layout browser geometry oracle
    needs: changes
    if: needs.changes.outputs.chromium == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -e . pytest playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/browser/test_sfle_chromium.py tests/browser/test_sfle_engine_chromium.py tests/browser/test_sfle_headless_oracle.py tests/browser/test_sfle_seeded_fuzz_regression.py

  qt:
    name: Native layout Qt native components
    needs: changes
    if: needs.changes.outputs.qt == 'true'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 xvfb xauth python3-tk
      - run: python -m pip install -e '.[pyside6]' pytest Pillow
      - name: Install pinned Pydux dependency required by existing PySide6 integration tests
        run: |
          python -m pip install "git+https://github.com/Neuri-AI/Pydux.git@8de71cee892c5e65a5b5fb223829f4525680a543"
      - run: python -m pytest -q tests/test_pyside6_renderer.py tests/test_qt_css_control_background.py tests/test_qt_semantic_border_scope.py tests/test_qt_scroll_wheel_continuity.py tests/test_qt_html_form_associations.py tests/test_grid_html_parent.py tests/test_qt_link_refresh_navigation.py tests/test_qt_missing_image_intrinsic.py tests/sfle/test_qt_inline_form_baselines.py tests/sfle/test_qt_native_lifecycle.py tests/test_pyside6_native_layout.py tests/test_pyside6_external_native_ports.py tests/sfle/test_grid_native_measurement.py tests/sfle/test_grid_native_commit.py --junitxml=scroll-qt-operations.xml
      - name: Compare real QSS and Xvfb Tk rounded-card pixels
        env:
          PSX_CORNER_VISUAL_OUTPUT: native-rounded-visual
        run: xvfb-run -a python -m pytest -q -rs tests/test_native_rounded_card_visual.py --junitxml=rounded-card-visual.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qt-tk-rounded-card-visual
          path: |
            native-rounded-visual/
            rounded-card-visual.xml
          if-no-files-found: error
      - run: python -m tests.certification.scroll_operation_receipts --backend qt --junit scroll-qt-operations.xml --out scroll-qt-operations.json
      - uses: actions/upload-artifact@v4
        with:
          name: scroll-qt-operation-receipts
          path: |
            scroll-qt-operations.xml
            scroll-qt-operations.json

  qt-parity:
    name: Native layout Qt SFLE parity ${{ matrix.binding }} / Python ${{ matrix.python }}
    needs: changes
    if: needs.changes.outputs.qt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - binding: pyside6
            package: PySide6
            python: "3.12"
          - binding: pyqt6
            package: PyQt6
            python: "3.12"
          - binding: pyqt5
            package: PyQt5
            python: "3.12"
          # PySide2's last official wheels only list up to CPython 3.10.
          # Keep it isolated; an install failure must fail this required job.
          - binding: pyside2
            package: PySide2==5.15.2.1
            python: "3.10"
    env:
      QT_QPA_PLATFORM: offscreen
      PSX_QT_BINDING: ${{ matrix.binding }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install native Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install PSX and only the selected Qt binding
        run: |
          python -m pip install -e . pytest
          python -m pip install --only-binary=:all: "${{ matrix.package }}"
      - name: Check binding and native SFLE parity (no skip)
        run: |
          python -c "import importlib; p={'pyside6':'PySide6','pyqt6':'PyQt6','pyqt5':'PyQt5','pyside2':'PySide2'}['${{ matrix.binding }}']; importlib.import_module(p+'.QtWidgets')"
          PSX_GRID_BACKEND=qt python -m pytest -q -rs tests/test_qt_native_component_lifecycle.py tests/test_mounted_grid_native_renderers.py --junitxml=native-layout-qt.xml
          python -m psx.sfle.native_operation_receipts --backend qt --junit native-layout-qt.xml --out native-layout-qt-certification.json
          python -m tests.certification.native_acceptance_receipts --backend qt --junit native-layout-qt.xml --out native-layout-qt-c6.json
          python -m tests.certification.native_invalidation_receipts --backend qt --junit native-layout-qt.xml --out native-layout-qt-c5.json
          python -m psx.sfle.native_external_ownership_receipts --backend qt --junit native-layout-qt.xml --out native-layout-qt-c4.json
          # A fresh process is required: Qt consumes QT_SCALE_FACTOR at
          # QApplication initialization, and Qt 5/6 may round the reported
          # physical DPR differently. The geometry must stay in QWidget DIPs.
          QT_SCALE_FACTOR=1.5 PSX_GRID_BACKEND=qt python -m pytest -q -rs tests/test_qt_native_component_lifecycle.py tests/test_mounted_grid_native_renderers.py --junitxml=native-layout-qt-dpi.xml
          python -m psx.sfle.native_operation_receipts --backend qt --junit native-layout-qt-dpi.xml --out native-layout-qt-dpi-certification.json
          python -m tests.certification.native_acceptance_receipts --backend qt --junit native-layout-qt-dpi.xml --out native-layout-qt-dpi-c6.json
          python -m tests.certification.native_invalidation_receipts --backend qt --junit native-layout-qt-dpi.xml --out native-layout-qt-dpi-c5.json
          python -m psx.sfle.native_external_ownership_receipts --backend qt --junit native-layout-qt-dpi.xml --out native-layout-qt-dpi-c4.json
      - name: Capture prolonged Qt native image ownership samples
        env:
          PSX_GRID_BACKEND: qt
          PSX_SOAK_CYCLES: "2048"
          PSX_SOAK_REPORT: native-image-soak-qt-${{ matrix.binding }}.json
        run: python -m pytest -q tests/test_mounted_grid_native_renderers.py::test_native_image_churn_releases_owned_decoded_buffers
      - name: Capture prolonged qt keyed tree ownership samples
        env:
          PSX_GRID_BACKEND: qt
          PSX_TREE_SOAK_CYCLES: "512"
          PSX_TREE_SOAK_REPORT: native-tree-soak-qt-${{ matrix.binding }}.json
        run: python -m pytest -q tests/test_mounted_grid_native_renderers.py::test_native_keyed_tree_reconciliation_soak
      - uses: actions/upload-artifact@v4
        with:
          name: native-image-soak-qt-${{ matrix.binding }}
          path: |
            native-image-soak-qt-${{ matrix.binding }}.json
            native-tree-soak-qt-${{ matrix.binding }}.json
          if-no-files-found: error
      - name: Capture Qt binding-only QWidget and signal reference observations
        env:
          PSX_GRID_BACKEND: qt
          PSX_TREE_SOAK_CYCLES: "512"
          PSX_BINDING_REFERENCE_REPORT: native-binding-reference-qt-${{ matrix.binding }}.json
        run: python -m pytest -q tests/test_mounted_grid_native_renderers.py::test_qt_binding_only_signal_wrapper_reference_soak
      - uses: actions/upload-artifact@v4
        with:
          name: native-binding-reference-qt-${{ matrix.binding }}
          path: native-binding-reference-qt-${{ matrix.binding }}.json
          if-no-files-found: error
      - name: Certify public native Qt property behavior with semantic JUnit evidence
        run: |
          PSX_GRID_BACKEND=qt python -m pytest -q tests/test_qt_public_behavior.py tests/test_mounted_grid_native_renderers.py --junitxml=public-native-qt.xml
          python -m tests.certification.public_behavior_census --out public-native-qt-inventory.json --junit public-native-qt.xml --sha "${{ github.sha }}" --environment "ubuntu-qt-${{ matrix.binding }}-python-${{ matrix.python }}"
      - uses: actions/upload-artifact@v4
        with:
          name: public-native-qt-receipts-${{ matrix.binding }}
          path: |
            public-native-qt.xml
            public-native-qt-inventory.json
            public-native-qt-inventory-receipts.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: native-layout-qt-receipts-${{ matrix.binding }}
          path: |
            native-layout-qt.xml
            native-layout-qt-dpi.xml
            native-layout-qt-certification.json
            native-layout-qt-dpi-certification.json
            native-layout-qt-c6.json
            native-layout-qt-c5.json
            native-layout-qt-dpi-c6.json
            native-layout-qt-dpi-c5.json
            native-layout-qt-c4.json
            native-layout-qt-dpi-c4.json

  kivy:
    name: Native layout Kivy native components
    needs: changes
    if: needs.changes.outputs.kivy == 'true'
    runs-on: ubuntu-latest
    env:
      KIVY_NO_ARGS: "1"
      KIVY_NO_CONSOLELOG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libmtdev1 libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-ttf-2.0-0
      - run: python -m pip install -e '.[kivy]' pytest
      - run: xvfb-run -a python -m pytest -q tests/test_kivy_renderer.py tests/test_kivy_native_layout.py tests/test_kivy_window_resize_coalescing.py tests/test_kivy_scroll_trackpad_input.py tests/test_kivy_css_border_retina.py tests/test_kivy_css_cursor.py tests/sfle/test_grid_native_measurement.py tests/sfle/test_grid_native_commit.py --junitxml=native-layout-kivy.xml
      - run: PSX_GRID_BACKEND=kivy xvfb-run -a python -m pytest -q tests/test_mounted_grid_native_renderers.py
      - run: |
          python -m tests.certification.scroll_operation_receipts --backend kivy --junit native-layout-kivy.xml --out scroll-kivy-operations.json
          python -m psx.sfle.native_operation_receipts --backend kivy --junit native-layout-kivy.xml --out native-layout-kivy-certification.json
