name: P0 Tkinter Kivy native lifecycle

on:
  push:
    branches: [develop]
    paths:
      - "psx/core/**"
      - "psx/renderers/tkinter/**"
      - "psx/renderers/kivy/**"
      - "tests/test_p0_tkinter_native_lifecycle.py"
      - "tests/test_p0_kivy_native_lifecycle.py"
      - "tests/test_tkinter_renderer.py"
      - "tests/test_kivy_renderer.py"
      - ".github/workflows/p0-tk-kivy-lifecycle.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-tk-kivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tkinter:
    name: Tkinter native lifetime Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Tk native display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-tk libx11-6 libxext6
      - name: Install current PSX checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tk actual widget ownership and cleanup checks
        run: |
          xvfb-run -a python -m pytest -q \
            tests/test_p0_tkinter_native_lifecycle.py \
            tests/test_tkinter_renderer.py

  kivy:
    name: Kivy native lifetime Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      KIVY_NO_FILELOG: "1"
      KIVY_NO_ARGS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Kivy native display and SDL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libgl1 libgl1-mesa-dri \
            libmtdev1 libx11-6 libxext6 libxrender1 libxrandr2 libxcursor1 \
            libxi6 libsm6 libice6 libasound2-dev
      - name: Install PSX with Kivy extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,kivy]"
      - name: Kivy actual widget ownership and cleanup checks
        run: |
          xvfb-run -a python -m pytest -q \
            tests/test_p0_kivy_native_lifecycle.py \
            tests/test_kivy_renderer.py
