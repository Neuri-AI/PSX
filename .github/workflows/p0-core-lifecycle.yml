name: P0 core lifecycle verification

on:
  push:
    branches: [develop]
    paths:
      - "psx/core/hooks.py"
      - "psx/core/reconcile.py"
      - "psx/core/instance.py"
      - "psx/core/events.py"
      - "tests/test_core.py"
      - "tests/test_hooks_scheduler.py"
      - "tests/test_p0_teardown_diagnostics.py"
      - "tests/test_p0_dependency_graph.py"
      - "scripts/verify_velto_dependency_graph.py"
      - ".github/workflows/p0-core-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    name: Lifecycle Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PSX test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run core lifecycle regression tests
        run: |
          python -m pytest -q \
            tests/test_p0_teardown_diagnostics.py \
            tests/test_core.py \
            tests/test_hooks_scheduler.py
      - name: Verify source syntax
        run: |
          python -m compileall -q psx/core
          python -m py_compile scripts/verify_velto_dependency_graph.py
