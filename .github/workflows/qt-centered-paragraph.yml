name: HTML block full-width parity

on:
  push:
    branches: [fixes/psx-issues]
    paths:
      - 'psx/sfle/qt_measurement.py'
      - 'psx/sfle/native_layout_snapshot.py'
      - 'tests/test_tkinter_native_layout.py'
      - 'tests/test_kivy_native_layout.py'
      - 'psx/sfle/compute_alpha.py'
      - 'rust/sfle-core/src/compute_layout.rs'
      - 'rust/sfle-core/tests/f2_centered_auto_cross.rs'
      - 'tests/sfle/test_centered_auto_width.py'
      - 'psx/sfle/qt_layout_bridge.py'
      - 'tests/test_pyside6_native_layout.py'
      - '.github/workflows/qt-centered-paragraph.yml'
  pull_request:
    paths:
      - 'psx/sfle/qt_measurement.py'
      - 'psx/sfle/qt_layout_bridge.py'
      - 'tests/test_pyside6_native_layout.py'
      - '.github/workflows/qt-centered-paragraph.yml'

permissions:
  contents: read

jobs:
  real-qt:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install native Qt and PSX
        run: python -m pip install -e '.[pyside6]' pytest
      - name: Test real Qt centered paragraph, widths and resize clipping
        run: >-
          python -m pytest -q
          tests/sfle/test_centered_auto_width.py
          tests/test_pyside6_native_layout.py
          tests/sfle/test_nested_block_flex_layout.py

  native-tk:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tcl/Tk and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth
          python -m pip install -e . pytest
      - name: Verify native Tkinter block width and font-height geometry
        run: >-
          xvfb-run -a python -m pytest -q
          tests/test_tkinter_native_layout.py
          -k centered_column_block_and_text_widths_survive_resize

  native-kivy:
    runs-on: ubuntu-latest
    env:
      KIVY_NO_ARGS: '1'
      KIVY_NO_FILELOG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SDL2/Xvfb/Kivy
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libmtdev1 libgl1 libx11-6 libegl1 libopengl0
          python -m pip install -e '.[kivy]' pytest Pillow
      - name: Verify native Kivy block width and font-height geometry
        run: >-
          xvfb-run -a python -m pytest -q
          tests/test_kivy_native_layout.py
          -k centered_column_blocks_remain_full_width_after_resize

  rust-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust Cinnamon centered auto cross sizing
        run: cargo test --manifest-path rust/sfle-core/Cargo.toml --test f2_centered_auto_cross
