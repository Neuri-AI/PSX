name: Qt centered paragraph intrinsic layout

on:
  push:
    branches: [fixes/psx-issues]
    paths:
      - 'psx/sfle/qt_measurement.py'
      - 'psx/sfle/compute_alpha.py'
      - 'rust/sfle-core/src/compute_layout.rs'
      - 'rust/sfle-core/tests/f2_centered_auto_cross.rs'
      - 'tests/sfle/test_centered_auto_width.py'
      - 'psx/sfle/qt_layout_bridge.py'
      - 'tests/test_pyside6_native_layout.py'
      - '.github/workflows/qt-centered-paragraph.yml'
  pull_request:
    paths:
      - 'psx/sfle/qt_measurement.py'
      - 'psx/sfle/qt_layout_bridge.py'
      - 'tests/test_pyside6_native_layout.py'
      - '.github/workflows/qt-centered-paragraph.yml'

permissions:
  contents: read

jobs:
  real-qt:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install native Qt and PSX
        run: python -m pip install -e '.[pyside6]' pytest
      - name: Test real Qt centered paragraph, widths and resize clipping
        run: >-
          python -m pytest -q
          tests/sfle/test_centered_auto_width.py
          tests/test_pyside6_native_layout.py
          -k "centered_auto_width or centered_flex_paragraph or explicit_width_is_not_overridden"

  rust-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust Cinnamon centered auto cross sizing
        run: cargo test --manifest-path rust/sfle-core/Cargo.toml --test f2_centered_auto_cross
