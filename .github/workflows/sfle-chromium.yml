name: SFLE Chromium geometry checkpoint

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "psx/sfle/**"
      - "tests/browser/test_sfle_chromium.py"
      - ".github/workflows/sfle-chromium.yml"
      - "pyproject.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  chromium-reference:
    name: Chromium SFLE border geometry
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install PSX and Playwright
        run: python -m pip install -e . pytest playwright==1.63.0
      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium
      - name: Compare SFLE rectangles to browser geometry
        run: python -m pytest -q tests/browser/test_sfle_chromium_version.py tests/browser/test_sfle_chromium.py tests/browser/test_sfle_f2_corpus.py tests/browser/test_sfle_f2_engine_chromium.py tests/browser/test_sfle_f2_live_text_chromium.py tests/browser/test_sfle_f2_css_reference_matrix.py tests/browser/test_sfle_f2_seeded_fuzz_red.py
      - name: Verify five independent holdout seeds (200 each)
        run: python -m pytest -q -s tests/browser/test_sfle_f2_holdout_red.py
      - name: Preserve complete per-seed RED outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfle-chromium-holdout-${{ github.run_id }}
          path: /tmp/sfle-holdout-results/*.json
          if-no-files-found: warn
