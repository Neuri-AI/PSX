name: SFLE Chromium geometry checkpoint

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "**/*.md"
  push:
    branches:
      - main
    paths:
      - "psx/sfle/**"
      - "tests/browser/test_sfle_chromium.py"
      - ".github/workflows/sfle-chromium.yml"
      - "pyproject.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  docs-impact:
    uses: ./.github/workflows/docs-delta.yml

  chromium-reference:
    needs: docs-impact
    if: needs.docs-impact.outputs.run_checks == 'true'
    name: Chromium SFLE border geometry
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install PSX and Playwright
        run: python -m pip install -e . pytest playwright==1.63.0
      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium
      - name: Compare SFLE rectangles to browser geometry
        run: python -m pytest -q tests/browser/test_sfle_chromium_version.py tests/browser/test_sfle_chromium.py tests/browser/test_sfle_corpus.py tests/browser/test_sfle_engine_chromium.py tests/browser/test_sfle_live_text_chromium.py tests/browser/test_sfle_headless_oracle.py tests/browser/test_sfle_independent_dimension_holdout.py tests/browser/test_sfle_css_reference_matrix.py tests/browser/test_sfle_intrinsic_keywords_regression.py tests/browser/test_sfle_intrinsic_constraints_regression.py tests/browser/test_sfle_nonlinear_freeze_regression.py tests/browser/test_sfle_recursive_cross_percentage_regression.py tests/browser/test_sfle_recursive_intrinsic_bounds_regression.py tests/browser/test_sfle_recursive_row_intrinsic_regression.py tests/browser/test_sfle_nested_cyclic_padding_regression.py tests/browser/test_sfle_cyclic_multi_padding_regression.py tests/browser/test_sfle_seeded_fuzz_regression.py
      - name: Verify five independent holdout seeds (200 each)
        run: python -m pytest -q -s tests/browser/test_sfle_holdout_regression.py
      - name: Audit expanded CSS dimensions (all RED until Chromium geometry agrees)
        if: success() || failure()
        run: python -m pytest -q -s tests/browser/test_sfle_rtl_regression.py tests/browser/test_sfle_reverse_regression.py tests/browser/test_sfle_wrap_fixed_regression.py tests/browser/test_sfle_nested_columns_regression.py tests/browser/test_sfle_intrinsic_max_regression.py tests/browser/test_sfle_min_max_regression.py tests/browser/test_sfle_alignment_regression.py tests/browser/test_sfle_align_items_regression.py tests/browser/test_sfle_align_self_regression.py tests/browser/test_sfle_align_content_regression.py tests/browser/test_sfle_margins_regression.py
      - name: Verify individually committed RED holdout fixtures against Chromium
        if: success() || failure()
        run: python -m pytest -q -s tests/browser/test_sfle_holdout_fixtures_regression.py
      - name: Preserve complete per-seed RED outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfle-chromium-holdout-${{ github.run_id }}
          path: /tmp/sfle-holdout-results/*.json
          if-no-files-found: warn
