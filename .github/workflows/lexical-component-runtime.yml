name: Lexical component Python runtime

on:
  pull_request:
    paths:
      - 'psx/core/component.py'
      - 'psx/markup/component_compiler.py'
      - 'psx/markup/transform.py'
      - 'tests/test_component_lexical_runtime.py'
      - 'tests/test_markup_transform.py'
      - '.github/workflows/lexical-component-runtime.yml'
  push:
    branches:
      - 'fix/component-lexical-psx-runtime'
      - 'fixes/psx-issues'
    paths:
      - 'psx/core/component.py'
      - 'psx/markup/component_compiler.py'
      - 'psx/markup/transform.py'
      - 'tests/test_component_lexical_runtime.py'
      - '.github/workflows/lexical-component-runtime.yml'

jobs:
  plain-python-entrypoint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Verify normal Python startup and hooks
        run: python -m pytest -q tests/test_component_lexical_runtime.py tests/test_markup_transform.py
