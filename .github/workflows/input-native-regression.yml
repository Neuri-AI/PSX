name: Input events and Native CSS regression

on:
  pull_request:
    branches: [develop]
    paths:
      - 'psx/core/**'
      - 'psx/markup/**'
      - 'psx/css/**'
      - 'psx/renderers/**'
      - 'psx/sfle/**'
      - 'tests/test_expressive_arithmetic_regression.py'
      - 'tests/test_native_css_dimensions.py'
      - 'tests/test_qt_input_click.py'
      - '.github/workflows/input-native-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Portable input and sizing / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_expressive_arithmetic_regression.py tests/test_native_css_dimensions.py tests/test_arrow_callback_rendering.py

  qt-input:
    name: Native Qt input click / Linux
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[pyside6]' pytest
      - run: python -m pytest -q tests/test_qt_input_click.py
