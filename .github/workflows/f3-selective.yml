name: F3 selective validation

on:
  pull_request:
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  changes:
    name: F3 classify full PR diff
    runs-on: ubuntu-latest
    outputs:
      router: "${{ steps.select.outputs.router }}"
      core: "${{ steps.select.outputs.core }}"
      sfle: "${{ steps.select.outputs.sfle }}"
      rust: "${{ steps.select.outputs.rust }}"
      chromium: "${{ steps.select.outputs.chromium }}"
      qt: "${{ steps.select.outputs.qt }}"
      kivy: "${{ steps.select.outputs.kivy }}"
      tkinter: "${{ steps.select.outputs.tkinter }}"
      headless: "${{ steps.select.outputs.headless }}"
      native: "${{ steps.select.outputs.native }}"
      legacy: "${{ steps.select.outputs.legacy }}"
      full: "${{ steps.select.outputs.full }}"
      docs_only: "${{ steps.select.outputs.docs_only }}"
      selected: "${{ steps.select.outputs.selected }}"
    steps:
      - uses: actions/checkout@v4
      - name: Read complete changed paths (including rename sources)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let changed = [];
            if (context.eventName === 'pull_request') {
              try {
                const common = {owner: context.repo.owner, repo: context.repo.repo};
                const before = context.payload.before;
                const after = context.payload.after;
                const pr = context.issue.number;
                let verifiedDelta = false;
                // Verified docs-only synchronizations skip all tests regardless
                // of the previous CI status (including cancelled/failed).
                if (context.payload.action === 'synchronize' && before && after) {
                  const diff = await github.rest.repos.compareCommits({
                    ...common, base: before, head: after, per_page: 100,
                  });
                  const entries = diff.data.files || [];
                  const safeDelta = diff.data.total_commits <= 250 &&
                    entries.length > 0 && entries.length < 300;
                  if (safeDelta) {
                    const deltaPaths = entries.flatMap(file =>
                      [file.filename, file.previous_filename].filter(Boolean));
                    const isDocs = path => path === 'README.md' ||
                      path.startsWith('docs/') ||
                      (path.endsWith('.md') && !path.startsWith('.github/'));
                    const docsOnly = deltaPaths.every(isDocs);
                    if (docsOnly) {
                      changed = deltaPaths;
                      verifiedDelta = true;
                      core.info('Verified docs-only PR update: zero tests, ' +
                        'even if previous CI did not finish.');
                    } else {
                      // A passing docs-only router is not a passing product CI.
                      // Reuse a code delta only when the prior HEAD passed tests.
                      const past = await github.rest.actions.listWorkflowRunsForRepo({
                        ...common, head_sha: before, event: 'pull_request', per_page: 100,
                      });
                      const previous = (past.data.workflow_runs || []).find(run =>
                        run.name === 'F3 selective validation' &&
                        run.head_sha === before &&
                        run.status === 'completed' &&
                        run.conclusion === 'success' &&
                        (run.pull_requests || []).some(p => p.number === pr));
                      if (previous) {
                        const pastJobs = await github.paginate(
                          github.rest.actions.listJobsForWorkflowRun, {
                            ...common, run_id: previous.id, per_page: 100,
                          });
                        const hasSuccessfulProductJob = pastJobs.some(job =>
                          job.conclusion === 'success' &&
                          /^F3 (?:core and registry|SFLE geometry contracts|Rust and Python differential|browser geometry oracle|Qt native components|Qt SFLE parity|Kivy native components|Tkinter native components|deterministic Headless|native wheel and Python fallback)/.test(job.name));
                        if (hasSuccessfulProductJob) {
                          changed = deltaPaths;
                          verifiedDelta = true;
                          core.info('Previously certified HEAD ' + before +
                            ': revalidating only changes through ' + after);
                        }
                      }
                    }
                  }
                }
                if (!verifiedDelta) {
                  // New PR, previous failure, ambiguous delta or missing
                  // predecessor: evaluate ALL cumulative changed paths.
                  const files = await github.paginate(github.rest.pulls.listFiles, {
                    ...common, pull_number: pr, per_page: 100,
                  });
                  if (files.length >= 3000) {
                    core.warning('PR exceeds complete file inventory; select all checks.');
                  } else {
                    changed = files.flatMap(file =>
                      [file.filename, file.previous_filename].filter(Boolean));
                  }
                }
              } catch (error) {
                core.warning('Diff/provenance unavailable: full testing. ' + error.message);
                changed = [];
              }
            }
            fs.writeFileSync('f3-changed-files.json', JSON.stringify(changed));
      - name: Select impacted suites; fail open on missing diff
        id: select
        env:
          F3_FULL: "${{ github.event_name == 'workflow_dispatch' }}"
        shell: bash
        run: |
          args=()
          if [[ "$F3_FULL" == "true" ]]; then args+=(--full); fi
          python scripts/ci/impact.py --changed-json f3-changed-files.json --github-output "$GITHUB_OUTPUT" "${args[@]}"
      - name: Explain CI selection
        run: |
          echo "Selected checks: ${{ steps.select.outputs.selected }}"
          echo "Docs-only: ${{ steps.select.outputs.docs_only }}"
          echo "Full certification: ${{ steps.select.outputs.full }}"

  selector-tests:
    name: F3 change-router regression
    needs: changes
    if: needs.changes.outputs.router == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify zero-doc and dependency-aware routing
        run: python -m unittest discover -s tests -p test_ci_impact.py -v

  core:
    name: F3 core and registry
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_core.py tests/test_component_contracts.py tests/test_component_registry.py tests/test_markup_registry.py tests/test_markup.py tests/test_hooks_scheduler.py tests/test_renderer_adapters.py tests/test_f3_flex_contract.py tests/test_f3_g1_item_metadata.py tests/test_f3_g2_snapshot.py tests/test_f3_g2_native_coverage.py tests/test_f3_g2_matrix.py tests/test_f3_g2_contracts.py tests/test_f3_g2_c4_contracts.py tests/test_f3_g2_c5_invalidation.py tests/test_f3_g2_c5_native_cache.py tests/test_f3_g2_external_ports.py tests/test_f3_g2_width_remeasurement.py tests/test_f3_g2_native_pixel_scale.py tests/test_f3_g2_headless.py

  sfle:
    name: F3 SFLE geometry contracts
    needs: changes
    if: needs.changes.outputs.sfle == 'true'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt offscreen libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install -e '.[qt]' pytest
      - run: python -m pytest -q -rs tests/sfle

  rust:
    name: F3 Rust and Python differential
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/sfle-core/Cargo.toml --all-targets
      - run: python -m pip install -e . pytest
      - name: Rust/Python capability and geometry agreement
        run: python -m pytest -q tests/interop/test_sfle_f2_differential.py tests/interop/test_sfle_f2_point2_capability_parity.py tests/interop/test_sfle_f2_point5_deferral_boundaries.py

  chromium:
    name: F3 browser geometry oracle
    needs: changes
    if: needs.changes.outputs.chromium == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -e . pytest playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/browser/test_sfle_chromium.py tests/browser/test_sfle_f2_engine_chromium.py tests/browser/test_sfle_f2_headless_oracle.py tests/browser/test_sfle_f2_seeded_fuzz_red.py

  qt:
    name: F3 Qt native components
    needs: changes
    if: needs.changes.outputs.qt == 'true'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install -e '.[qt]' pytest
      - name: Install pinned Pydux dependency required by existing PySide6 integration tests
        run: |
          python -m pip install "git+https://github.com/Neuri-AI/Pydux.git@56e6df858bc0e1ae598cd1cab0aa384c921cf253"
      - run: python -m pytest -q tests/test_pyside6_renderer.py tests/sfle/test_qt_native_lifecycle.py tests/test_pyside6_f3_g2_renderer.py tests/test_pyside6_f3_g2_external.py

  qt-parity:
    name: F3 Qt SFLE parity ${{ matrix.binding }} / Python ${{ matrix.python }}
    needs: changes
    if: needs.changes.outputs.qt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - binding: pyside6
            package: PySide6
            python: "3.12"
          - binding: pyqt6
            package: PyQt6
            python: "3.12"
          - binding: pyqt5
            package: PyQt5
            python: "3.12"
          # PySide2's last official wheels only list up to CPython 3.10.
          # Keep it isolated; an install failure must fail this required job.
          - binding: pyside2
            package: PySide2==5.15.2.1
            python: "3.10"
    env:
      QT_QPA_PLATFORM: offscreen
      PSX_QT_BINDING: ${{ matrix.binding }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install native Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install PSX and only the selected Qt binding
        run: |
          python -m pip install -e . pytest
          python -m pip install --only-binary=:all: "${{ matrix.package }}"
      - name: Check binding and native SFLE parity (no skip)
        run: |
          python -c "import importlib; p={'pyside6':'PySide6','pyqt6':'PyQt6','pyqt5':'PyQt5','pyside2':'PySide2'}['${{ matrix.binding }}']; importlib.import_module(p+'.QtWidgets')"
          python -m pytest -q -rs tests/test_f3_g2_qt_family.py --junitxml=g2-qt.xml
          python -m psx.sfle.f3_g2_receipts --backend qt --junit g2-qt.xml --out g2-qt-certification.json
          python -m psx.sfle.f3_g2_c4_receipts --backend qt --junit g2-qt.xml --out g2-qt-c4.json
          # A fresh process is required: Qt consumes QT_SCALE_FACTOR at
          # QApplication initialization, and Qt 5/6 may round the reported
          # physical DPR differently. The geometry must stay in QWidget DIPs.
          QT_SCALE_FACTOR=1.5 python -m pytest -q -rs tests/test_f3_g2_qt_family.py --junitxml=g2-qt-dpi.xml
          python -m psx.sfle.f3_g2_receipts --backend qt --junit g2-qt-dpi.xml --out g2-qt-dpi-certification.json
          python -m psx.sfle.f3_g2_c4_receipts --backend qt --junit g2-qt-dpi.xml --out g2-qt-dpi-c4.json
      - uses: actions/upload-artifact@v4
        with:
          name: g2-qt-receipts-${{ matrix.binding }}
          path: |
            g2-qt-certification.json
            g2-qt-dpi-certification.json
            g2-qt-c4.json
            g2-qt-dpi-c4.json

  kivy:
    name: F3 Kivy native components
    needs: changes
    if: needs.changes.outputs.kivy == 'true'
    runs-on: ubuntu-latest
    env:
      KIVY_NO_ARGS: "1"
      KIVY_NO_CONSOLELOG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libmtdev1 libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-ttf-2.0-0
      - run: python -m pip install -e '.[kivy]' pytest
      - run: xvfb-run -a python -m pytest -q tests/test_kivy_renderer.py tests/test_kivy_f3_g2_renderer.py --junitxml=g2-kivy.xml
      - run: |
          python -m psx.sfle.f3_g2_receipts --backend kivy --junit g2-kivy.xml --out g2-kivy-certification.json
          python -m psx.sfle.f3_g2_c4_receipts --backend kivy --junit g2-kivy.xml --out g2-kivy-c4.json
      - uses: actions/upload-artifact@v4
        with:
          name: g2-kivy-receipts
          path: |
            g2-kivy-certification.json
            g2-kivy-c4.json

  tkinter:
    name: F3 Tkinter native components
    needs: changes
    if: needs.changes.outputs.tkinter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth python3-tk
      # Pillow supplies arbitrary scaling/cropping for the optional Tk Image
      # renderer; plain Tk PhotoImage still supports natural-size PNG.
      - run: python -m pip install -e . pytest Pillow
      - run: xvfb-run -a python -m pytest -q tests/test_tkinter_renderer.py tests/test_tkinter_f3_g2_renderer.py tests/test_tkinter_f3_g2_external.py --junitxml=g2-tk.xml
      - run: |
          python -m psx.sfle.f3_g2_receipts --backend tk --junit g2-tk.xml --out g2-tk-certification.json
          python -m psx.sfle.f3_g2_c4_receipts --backend tk --junit g2-tk.xml --out g2-tk-c4.json
      - uses: actions/upload-artifact@v4
        with:
          name: g2-tk-receipts
          path: |
            g2-tk-certification.json
            g2-tk-c4.json

  headless:
    name: F3 deterministic Headless
    needs: changes
    if: needs.changes.outputs.headless == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_core.py tests/test_renderer_adapters.py tests/test_f3_g2_headless.py --junitxml=g2-headless.xml
      - run: python -m psx.sfle.f3_g2_receipts --backend headless --junit g2-headless.xml --out g2-headless-certification.json
      - uses: actions/upload-artifact@v4
        with:
          name: g2-headless-receipts
          path: g2-headless-certification.json

  native:
    name: F3 native wheel and Python fallback ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-2022", "macos-15-intel", "macos-15"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python build and test dependencies
        run: python -m pip install -e . pytest "maturin>=1.8,<2"
      - name: Build installable wheel on actual runner
        run: maturin build --release --manifest-path rust/sfle-core/Cargo.toml --out wheelhouse
      - name: Install wheel and assert Rust primary ABI
        run: |
          python -m pip install --no-deps --find-links wheelhouse "psx-sfle-native==0.1.0"
          python -c "import _sfle_native as native; assert native.schema_version()==1"
      - name: Verify Rust/Python parity of installed wheel
        run: python -m pytest -q tests/interop/test_sfle_f2_native_wheel.py
      - name: Uninstall wheel and prove load-time Python fallback
        run: |
          python -m pip uninstall -y psx-sfle-native
          python -c "import importlib.util; assert importlib.util.find_spec('_sfle_native') is None"
          python -c "from psx.sfle.backend import load_layout_engine; assert load_layout_engine().backend_name=='python'"


  legacy:
    name: F3 G4 no-Row-or-Column final API gate
    needs: changes
    if: needs.changes.outputs.legacy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Reject any remaining public legacy layout API
        run: |
          python - <<'PY'
          import psx
          from psx.core.registry import builtin_component_registry
          registry = builtin_component_registry()
          for name in ("Row", "Column"):
              assert not registry.contains(name), f"{name} still in public registry"
              assert name not in psx.__all__, f"{name} still exported"
              assert not hasattr(psx, name), f"{name} still exposed"
          print("Legacy layout API absent as required for F3 G4/G5.")
          PY

  summary:
    name: F3 required CI conclusion
    needs: [changes, selector-tests, core, sfle, rust, chromium, qt, qt-parity, kivy, tkinter, headless, native, legacy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Ensure every selected job succeeded
        env:
          CHANGE_RESULT: "${{ needs.changes.result }}"
          SELECTED: "${{ needs.changes.outputs.selected }}"
          RESULTS: "${{ toJSON(needs) }}"
        run: |
          python - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          if os.environ["CHANGE_RESULT"] != "success":
              sys.exit("Change router did not succeed; CI cannot be certified.")
          selected = {x for x in os.environ["SELECTED"].split(",") if x}
          aliases = {"router": "selector-tests"}
          failures = []
          for suite in selected:
              job = aliases.get(suite, suite)
              outcome = needs.get(job, {}).get("result")
              if outcome != "success":
                  failures.append(f"{job}={outcome}")
          # Qt parity is a required four-binding matrix, not an optional
          # informational job. GitHub sets its aggregate result to failure if
          # any PySide6/PyQt6/PyQt5/PySide2 matrix cell fails or is cancelled.
          if "qt" in selected:
              parity = needs.get("qt-parity", {}).get("result")
              if parity != "success":
                  failures.append(f"qt-parity={parity}")
          if failures:
              sys.exit("Mandatory selected jobs not successful: " + ", ".join(failures))
          print("F3 selected suites GREEN:", ", ".join(sorted(selected)) or "(none)")
          PY
