name: Semantic inline fragments (experimental)

on:
  push:
    branches: [feature/semantic-inline-fragments]
    paths:
      - 'psx/sfle/semantic_inline_*.py'
      - 'psx/markup/html_aliases.py'
      - 'psx/sfle/*layout_bridge.py'
      - 'tests/sfle/test_semantic_inline_text.py'
      - 'tests/sfle/test_semantic_inline_native_layout.py'
      - '.github/workflows/semantic-inline-fragments.yml'
  pull_request:
    paths:
      - 'psx/sfle/semantic_inline_*.py'
      - 'psx/markup/html_aliases.py'
      - 'psx/sfle/*layout_bridge.py'
      - 'tests/sfle/test_semantic_inline_text.py'
      - '.github/workflows/semantic-inline-fragments.yml'

permissions:
  contents: read

jobs:
  pure:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/sfle/test_semantic_inline_text.py tests/sfle/test_semantic_inline_native_layout.py tests/test_markup_css_binding.py tests/sfle/test_mixed_inline_span.py

  native:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      KIVY_NO_ARGS: '1'
      KIVY_NO_FILELOG: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-tk libmtdev1 libgl1 libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install -e '.[pyside6,kivy]' pytest
      - run: python -m pytest -q tests/test_pyside6_native_layout.py -k 'mixed_inline_span_remains_in_paragraph_text_line or inline_span_padding_keeps_native_text_baselines'
      - run: xvfb-run -a python -m pytest -q tests/test_tkinter_native_layout.py -k 'inline_span_stays_on_paragraph_line_in_tk or inline_span_padding_does_not_shift_tk_glyph_baseline'
      - run: xvfb-run -a python -m pytest -q tests/test_kivy_native_layout.py -k 'mixed_inline_span_keeps_one_line_when_available or inline_span_padding_keeps_native_text_baseline'
