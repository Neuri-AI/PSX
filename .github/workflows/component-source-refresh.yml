name: Component source refresh
on:
  pull_request:
    branches: [develop]
    paths:
      - 'psx/devtools/qyro_reload.py'
      - 'psx/devtools/coordinated_refresh.py'
      - 'tests/test_coordinated_refresh.py'
      - '.github/workflows/component-source-refresh.yml'
permissions:
  contents: read
jobs:
  lexical-refresh:
    name: New module-level components during fast refresh
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest pandas
      - run: python -m pytest -q tests/test_coordinated_refresh.py tests/test_component_remount.py tests/test_component_lexical_runtime.py
