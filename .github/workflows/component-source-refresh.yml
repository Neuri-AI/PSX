name: Component source refresh
on:
  pull_request:
    branches: [develop]
    paths:
      - 'psx/devtools/qyro_reload.py'
      - 'psx/devtools/coordinated_refresh.py'
      - 'tests/test_coordinated_refresh.py'
      - 'tests/test_qt_native_chart_refresh.py'
      - 'psx/sfle/measured_block_snapshot.py'
      - 'tests/sfle/test_measured_block_snapshot.py'
      - 'tests/sfle/test_nested_block_flex_layout.py'
      - 'psx/sfle/grid_native_composition.py'
      - '.github/workflows/component-source-refresh.yml'
permissions:
  contents: read
jobs:
  lexical-refresh:
    name: New module-level components during fast refresh
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest pandas
      - name: Newly declared lexical components
        run: python -m pytest -q tests/test_coordinated_refresh.py -k 'hot_refresh_loads_new_top_level_decorated_component_without_restart or refresh_candidate_omits_unrelated_bootstrap_but_keeps_components or mounted_fast_refresh_adds_new_component_without_restart or hot_reload_preserves_native_widget_class_in_lexical_scope or hot_reload_ignores_unreferenced_classes_and_startup_code'
      - name: Baseline lexical runtime
        run: python -m pytest -q tests/test_component_lexical_runtime.py

  native-chart:
    name: Live Qt Native plot after source refresh
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native toolkit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install -e '.[pyside6]' pytest numpy pyqtgraph
      - name: Verify native box constraints and live chart resizing
        run: python -m pytest -q tests/sfle/test_measured_block_snapshot.py tests/sfle/test_nested_block_flex_layout.py tests/test_qt_native_chart_refresh.py
