name: F5.5 task board behavior

on:
  pull_request:
    branches: [develop]
    paths:
      - "examples/f5_5_task_board/**"
      - "docs/public/examples/task-board.mdx"
      - ".github/workflows/f5-5-task-board.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-board:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python examples/f5_5_task_board/app.py
      - run: python -m unittest -v test_app
        working-directory: examples/f5_5_task_board
