name: Build and publish Velto Core

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      component:
        description: 'Build target (manual runs never publish)'
        type: choice
        required: true
        default: core
        options:
          - core
          - cinnamon

permissions:
  contents: read

jobs:
  plan:
    name: Validate independent package versions
    runs-on: ubuntu-24.04
    outputs:
      component: ${{ steps.versions.outputs.component }}
      core_version: ${{ steps.versions.outputs.core_version }}
      cinnamon_version: ${{ steps.versions.outputs.cinnamon_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate versions, compatibility and release tag
        id: versions
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_COMPONENT: ${{ inputs.component }}
        run: |
          python -m pip install 'packaging>=24'
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from packaging.requirements import Requirement

          root = tomllib.loads(Path("pyproject.toml").read_text())
          cinnamon = tomllib.loads(Path("rust/cinnamon-core/pyproject.toml").read_text())
          cargo = tomllib.loads(Path("rust/cinnamon-core/Cargo.toml").read_text())
          core_version = root["project"]["version"]
          native_version = cinnamon["project"]["version"]
          assert cargo["package"]["version"] == native_version
          requirements = [Requirement(req) for req in root["project"]["dependencies"]]
          native_reqs = [req for req in requirements if req.name.lower() == "velto-cinnamon-core"]
          assert len(native_reqs) == 1, native_reqs
          spec = native_reqs[0].specifier
          assert native_version in spec, (native_version, str(spec))

          tag = os.environ.get("RELEASE_TAG") or ""
          if os.environ["EVENT_NAME"] == "release":
              if tag.startswith("cinnamon-v"):
                  component = "cinnamon"
                  assert tag == "cinnamon-v" + native_version, (tag, native_version)
              else:
                  component = "core"
                  assert tag == "v" + core_version, (tag, core_version)
          else:
              component = os.environ.get("REQUESTED_COMPONENT") or "core"
              assert component in {"core", "cinnamon"}

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"component={component}", file=output)
              print(f"core_version={core_version}", file=output)
              print(f"cinnamon_version={native_version}", file=output)
          print(f"Release target: {component}; Core {core_version}, Cinnamon {native_version}, allowed: {spec}")
          PY

  build-core:
    name: Build Velto Core Python distribution
    needs: plan
    if: needs.plan.outputs.component == 'core'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build universal wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --sdist --outdir dist
      - name: Validate Python distribution and dependency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from email.parser import Parser

          wheels = list(Path('dist').glob('*.whl'))
          sdists = list(Path('dist').glob('*.tar.gz'))
          assert len(wheels) == 1 and len(sdists) == 1, (wheels, sdists)
          assert wheels[0].name.endswith('py3-none-any.whl'), wheels[0]
          with ZipFile(wheels[0]) as z:
              names = z.namelist()
              assert any(p.startswith('psx/') and p.endswith('.py') for p in names)
              assert not any('_sfle_native' in p for p in names)
              metadata_name = next(p for p in names if p.endswith('.dist-info/METADATA'))
              metadata = Parser().parsestr(z.read(metadata_name).decode())
          requirements = metadata.get_all('Requires-Dist', [])
          assert any('velto-cinnamon-core' in requirement.lower() for requirement in requirements), requirements
          print('Validated:', wheels[0].name, 'requirements:', requirements)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: velto-core
          path: dist/*
          if-no-files-found: error

  build-native:
    name: Build Cinnamon / ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.component == 'cinnamon'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, os: ubuntu-24.04, interpreter: python3.10}
          - {platform: linux-aarch64, os: ubuntu-24.04-arm, interpreter: python3.10}
          - {platform: windows-x86_64, os: windows-2025, interpreter: python}
          - {platform: macos-x86_64, os: macos-15-intel, interpreter: python3.10}
          - {platform: macos-aarch64, os: macos-15, interpreter: python3.10}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Build ABI3 Rust extension
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >-
            --release
            --manifest-path rust/cinnamon-core/Cargo.toml
            --features python
            --out dist
            --interpreter ${{ matrix.interpreter }}
          manylinux: auto
      - name: Validate native wheel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          assert 'abi3' in wheels[0].name, wheels[0]
          assert wheels[0].name.startswith('velto_cinnamon_core-'), wheels[0]
          with ZipFile(wheels[0]) as z:
              names = z.namelist()
          assert any('_sfle_native' in p and p.endswith(('.so', '.pyd')) for p in names)
          print('Validated:', wheels[0].name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cinnamon-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error


  build-android:
    name: Cinnamon Android ARM64 / Python ${{ matrix.python }}
    needs: plan
    if: needs.plan.outputs.component == 'cinnamon'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.10', patch: '3.10.22', abi: cp310}
          - {python: '3.11', patch: '3.11.17', abi: cp311}
          - {python: '3.12', patch: '3.12.15', abi: cp312}
          - {python: '3.13', patch: '3.13.16', abi: cp313}
          - {python: '3.14', patch: '3.14.8', abi: cp314}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Android build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libltdl-dev pkg-config cmake patchelf
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;28.2.13676358"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Python Android build tools
        run: python -m pip install "maturin>=1.16,<2" "python-for-android" packaging Cython
      - name: Restrict obsolete CPython ARMv7 patch to 32-bit Android
        if: matrix.python == '3.14'
        shell: bash
        run: |
          set -euo pipefail
          # p4a applies this ARMv7-only patch to ARM64 as well. It does
          # not match CPython 3.14.8, and ARM64 does not need the fix.
          python - <<'PY'
          from pathlib import Path
          import pythonforandroid.recipes.python3 as recipe
          source = Path(recipe.__file__)
          content = source.read_text()
          # Match only the offending line; don't depend on the ordering of
          # unrelated upstream patches or multiline indentation.
          target = "self.patches.append('patches/3.14_armv7l_fix.patch')"
          lines = content.splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if line.strip() == target]
          if len(matches) != 1:
              raise RuntimeError(
                  f"Expected exactly one ARMv7 patch registration; found {len(matches)}"
              )
          idx = matches[0]
          indent = lines[idx][:len(lines[idx]) - len(lines[idx].lstrip())]
          assert indent and lines[idx].endswith("\n")
          lines[idx] = (
              indent + "if arch.arch == 'armeabi-v7a':\n"
              + indent + "    " + target + "\n"
          )
          source.write_text("".join(lines))
          print("Restricted ARMv7-only patch in", source)
          PY
      - name: Build matching CPython Android runtime with p4a
        shell: bash
        env:
          PYTHON_PATCH: ${{ matrix.patch }}
        run: |
          set -euo pipefail
          # Unlike the previous build, use a REAL Android CPython runtime
          # for each version rather than linking 3.11-3.14 against 3.10.
          p4a create \
            --name="cinnamon-python-${{ matrix.abi }}" \
            --bootstrap=service_only \
            --requirements="python3==$PYTHON_PATCH,hostpython3==$PYTHON_PATCH" \
            --blacklist-requirements=pyjnius,android,genericndkbuild \
            --arch=arm64-v8a \
            --ndk-api=28 \
            --android-api=35 \
            --sdk-dir="$ANDROID_SDK_ROOT" \
            --ndk-dir="$ANDROID_NDK_HOME" \
            --storage-dir="$RUNNER_TEMP/p4a"
          mapfile -t libs < <(find "$RUNNER_TEMP/p4a" -type f -name "libpython${{ matrix.python }}.so" -path '*arm64-v8a*')
          if (( ${#libs[@]} == 0 )); then
            echo "::error::Android libpython${{ matrix.python }}.so was not built by p4a"
            exit 1
          fi
          LIB="${libs[0]}"
          test "$(od -An -tu2 -j18 -N2 "$LIB" | tr -d ' ')" = "183"
          # Maturin/PyO3 requires both the target library AND its generated
          # _sysconfigdata module in PYO3_CROSS_LIB_DIR.
          # p4a generates _sysconfigdata in both the CPython build tree and
          # the installed Android runtime. Prefer the installed target copy.
          PYTHON_ROOT="$(dirname "$LIB")/android-root/lib/python${{ matrix.python }}"
          if [[ ! -d "$PYTHON_ROOT" ]]; then
            echo "::error::Missing installed Android Python sysconfig directory: $PYTHON_ROOT"
            exit 1
          fi
          mapfile -t sysconfig < <(find "$PYTHON_ROOT" -maxdepth 1 \
            -type f -name '_sysconfigdata*.py' | sort)
          if (( ${#sysconfig[@]} != 1 )); then
            echo "::error::Expected exactly one installed Android ARM64 _sysconfigdata*.py; found ${#sysconfig[@]}"
            printf '%s\n' "${sysconfig[@]}"
            exit 1
          fi
          # Stage exact target-generated artifacts without modifying p4a's install.
          STAGE="$RUNNER_TEMP/cinnamon-android-python-${{ matrix.abi }}"
          mkdir -p "$STAGE"
          ln -s "$LIB" "$STAGE/$(basename "$LIB")"
          cp "${sysconfig[0]}" "$STAGE/$(basename "${sysconfig[0]}")"
          echo "ANDROID_PYTHON_LIB_DIR=$STAGE" >> "$GITHUB_ENV"
          echo "Android CPython: $LIB"
          echo "Android sysconfig: ${sysconfig[0]}"
      - name: Build Android wheel for CPython ${{ matrix.python }}
        shell: bash
        env:
          PYO3_CROSS_PYTHON_VERSION: ${{ matrix.python }}
          ANDROID_API: '28'
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android28-clang"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android28-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export PYO3_CROSS_LIB_DIR="$ANDROID_PYTHON_LIB_DIR"
          export RUSTFLAGS="-L native=$ANDROID_PYTHON_LIB_DIR"
          maturin build --release \
            --manifest-path rust/cinnamon-core/Cargo.toml \
            --no-default-features \
            --features python \
            --target aarch64-linux-android \
            --interpreter "python${{ matrix.python }}" \
            --compatibility pypi \
            --out dist
      - name: Verify CPython tag and ELF target
        shell: bash
        env:
          EXPECTED_ABI: ${{ matrix.abi }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          from packaging.utils import parse_wheel_filename
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, [x.name for x in wheels]
          name, _, _, tags = parse_wheel_filename(wheels[0].name)
          expected = os.environ["EXPECTED_ABI"]
          assert str(name) == "velto-cinnamon-core"
          assert any(t.interpreter == expected and t.abi == expected and
                     t.platform == "android_28_arm64_v8a" for t in tags), wheels[0].name
          with ZipFile(wheels[0]) as archive:
              modules = [n for n in archive.namelist()
                         if "_sfle_native" in n and n.endswith(".so")]
              assert len(modules) == 1, modules
              header = archive.read(modules[0])[:20]
          assert header[:4] == b"\x7fELF"
          assert header[4:6] == bytes([2, 1])
          assert int.from_bytes(header[18:20], "little") == 183
          print("Validated:", wheels[0].name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cinnamon-android-${{ matrix.abi }}-arm64-v8a
          path: dist/*.whl
          if-no-files-found: error

  compatibility:
    name: Python ${{ matrix.python }} / ${{ matrix.platform }}
    needs: [plan, build-core]
    if: needs.plan.outputs.component == 'core'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        platform: [linux-x86_64, linux-aarch64, windows-x86_64, macos-x86_64, macos-aarch64]
        include:
          - {platform: linux-x86_64, os: ubuntu-24.04}
          - {platform: linux-aarch64, os: ubuntu-24.04-arm}
          - {platform: windows-x86_64, os: windows-2025}
          - {platform: macos-x86_64, os: macos-15-intel}
          - {platform: macos-aarch64, os: macos-15}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: velto-core
          path: dist/
      - name: Install wheels without source builds
        shell: bash
        run: |
          python -m pip install --upgrade pip packaging
          python -m pip install --only-binary=:all: --find-links=dist velto-core
      - name: Validate installed packages and native module
        shell: bash
        run: |
          python -I - <<'PY'
          import importlib.metadata as metadata
          import psx
          import _sfle_native
          assert _sfle_native.schema_version() == 1
          from packaging.requirements import Requirement
          requirements = [Requirement(r) for r in metadata.requires('velto-core') or []]
          cinnamon = [r for r in requirements if r.name.lower() == 'velto-cinnamon-core']
          assert len(cinnamon) == 1
          installed = metadata.version('velto-cinnamon-core')
          assert installed in cinnamon[0].specifier, (installed, cinnamon[0])
          print('PSX:', psx.__file__)
          print('Cinnamon:', _sfle_native.__file__)
          PY

  verify-release:
    name: Verify selected release artifacts
    needs: [plan, build-core, build-native, build-android, compatibility]
    if: >-
      always() && github.event_name == 'release' &&
      github.event.action == 'published' &&
      needs.plan.result == 'success' &&
      ((needs.plan.outputs.component == 'core' &&
        needs.build-core.result == 'success' &&
        needs.compatibility.result == 'success') ||
       (needs.plan.outputs.component == 'cinnamon' &&
        needs.build-native.result == 'success' &&
        needs.build-android.result == 'success'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.component == 'core'
        with:
          name: velto-core
          path: dist/
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.component == 'cinnamon'
        with:
          pattern: cinnamon-*
          path: dist/
          merge-multiple: true
      - name: Validate selected version and artifacts
        shell: bash
        env:
          COMPONENT: ${{ needs.plan.outputs.component }}
          CORE_VERSION: ${{ needs.plan.outputs.core_version }}
          CINNAMON_VERSION: ${{ needs.plan.outputs.cinnamon_version }}
        run: |
          python -m pip install packaging
          python - <<'PY'
          import os
          from pathlib import Path
          from packaging.utils import parse_wheel_filename

          component = os.environ["COMPONENT"]
          files = sorted(Path("dist").iterdir())
          wheels = [p for p in files if p.suffix == ".whl"]
          sdists = [p for p in files if p.name.endswith(".tar.gz")]

          if component == "core":
              assert len(wheels) == 1 and len(sdists) == 1, [p.name for p in files]
              name, version, _, tags = parse_wheel_filename(wheels[0].name)
              assert str(name) == "velto-core"
              assert str(version) == os.environ["CORE_VERSION"]
              assert any(t.interpreter == "py3" and t.abi == "none" and t.platform == "any" for t in tags)
          else:
              assert component == "cinnamon"
              assert len(wheels) == 10 and not sdists, [p.name for p in files]
              android = set()
              for wheel in wheels:
                  name, version, _, tags = parse_wheel_filename(wheel.name)
                  assert str(name) == "velto-cinnamon-core"
                  assert str(version) == os.environ["CINNAMON_VERSION"]
                  for tag in tags:
                      if tag.platform == "android_28_arm64_v8a":
                          assert tag.interpreter == tag.abi, wheel.name
                          android.add(tag.interpreter)
              assert android == {"cp310", "cp311", "cp312", "cp313", "cp314"}, android
          for file in files:
              print(file.name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: dist/*
          if-no-files-found: error

  publish-cinnamon:
    name: Publish Cinnamon Rust to PyPI
    needs: [plan, verify-release]
    if: needs.plan.outputs.component == 'cinnamon'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    environment:
      name: pypi-cinnamon
      url: https://pypi.org/project/velto-cinnamon-core/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: all-dist/
      - name: Select Cinnamon wheels
        shell: bash
        run: |
          mkdir -p dist
          cp all-dist/velto_cinnamon_core-*.whl dist/
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 10
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-core:
    name: Publish Velto Core to PyPI
    needs: [plan, verify-release]
    if: needs.plan.outputs.component == 'core'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    environment:
      name: pypi-core
      url: https://pypi.org/project/velto-core/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: all-dist/
      - name: Select Velto Core distribution
        shell: bash
        run: |
          mkdir -p dist
          cp all-dist/velto_core-*.whl dist/
          cp all-dist/velto_core-*.tar.gz dist/
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  upload-release-assets:
    name: Attach distributions to GitHub Release
    needs: [plan, verify-release, publish-cinnamon, publish-core]
    if: >-
      always() && github.event_name == 'release' &&
      github.event.action == 'published' &&
      needs.verify-release.result == 'success' &&
      ((needs.plan.outputs.component == 'core' && needs.publish-core.result == 'success') ||
       (needs.plan.outputs.component == 'cinnamon' && needs.publish-cinnamon.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: dist/
      - name: Verify selected release asset count
        shell: bash
        env:
          COMPONENT: ${{ needs.plan.outputs.component }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          files = sorted(Path("dist").iterdir())
          expected = 2 if os.environ["COMPONENT"] == "core" else 10
          assert len(files) == expected, [p.name for p in files]
          for f in files:
              print(f.name)
          PY
      - name: Upload wheels and sdist to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber
