name: Build and publish Velto Core

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-core:
    name: Build Velto Core Python distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build universal wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --sdist --outdir dist
      - name: Validate Python distribution and dependency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from email.parser import Parser

          wheels = list(Path('dist').glob('*.whl'))
          sdists = list(Path('dist').glob('*.tar.gz'))
          assert len(wheels) == 1 and len(sdists) == 1, (wheels, sdists)
          assert wheels[0].name.endswith('py3-none-any.whl'), wheels[0]
          with ZipFile(wheels[0]) as z:
              names = z.namelist()
              assert any(p.startswith('psx/') and p.endswith('.py') for p in names)
              assert not any('_sfle_native' in p for p in names)
              metadata_name = next(p for p in names if p.endswith('.dist-info/METADATA'))
              metadata = Parser().parsestr(z.read(metadata_name).decode())
          requirements = metadata.get_all('Requires-Dist', [])
          assert any('velto-cinnamon-core' in requirement.lower() for requirement in requirements), requirements
          print('Validated:', wheels[0].name, 'requirements:', requirements)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: velto-core
          path: dist/*
          if-no-files-found: error

  build-native:
    name: Build Cinnamon / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, os: ubuntu-24.04, interpreter: python3.10}
          - {platform: linux-aarch64, os: ubuntu-24.04-arm, interpreter: python3.10}
          - {platform: windows-x86_64, os: windows-2025, interpreter: python}
          - {platform: macos-x86_64, os: macos-15-intel, interpreter: python3.10}
          - {platform: macos-aarch64, os: macos-15, interpreter: python3.10}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Build ABI3 Rust extension
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >-
            --release
            --manifest-path rust/cinnamon-core/Cargo.toml
            --features python
            --out dist
            --interpreter ${{ matrix.interpreter }}
          manylinux: auto
      - name: Validate native wheel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          assert 'abi3' in wheels[0].name, wheels[0]
          assert wheels[0].name.startswith('velto_cinnamon_core-'), wheels[0]
          with ZipFile(wheels[0]) as z:
              names = z.namelist()
          assert any('_sfle_native' in p and p.endswith(('.so', '.pyd')) for p in names)
          print('Validated:', wheels[0].name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cinnamon-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  compatibility:
    name: Python ${{ matrix.python }} / ${{ matrix.platform }}
    needs: [build-core, build-native]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        platform: [linux-x86_64, linux-aarch64, windows-x86_64, macos-x86_64, macos-aarch64]
        include:
          - {platform: linux-x86_64, os: ubuntu-24.04}
          - {platform: linux-aarch64, os: ubuntu-24.04-arm}
          - {platform: windows-x86_64, os: windows-2025}
          - {platform: macos-x86_64, os: macos-15-intel}
          - {platform: macos-aarch64, os: macos-15}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: velto-core
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: cinnamon-${{ matrix.platform }}
          path: dist/
      - name: Install wheels without source builds
        shell: bash
        run: |
          python -m pip install --only-binary=:all: --find-links=dist velto-core
      - name: Validate installed packages and native module
        shell: bash
        run: |
          python -I - <<'PY'
          import importlib.metadata as metadata
          import psx
          import _sfle_native
          assert _sfle_native.schema_version() == 1
          assert metadata.version('velto-core') == metadata.version('velto-cinnamon-core')
          print('PSX:', psx.__file__)
          print('Cinnamon:', _sfle_native.__file__)
          PY

  verify-release:
    name: Verify release versions and artifacts
    needs: [build-core, build-native, compatibility]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: velto-core
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          pattern: cinnamon-*
          path: dist/
          merge-multiple: true
      - name: Install artifact validation dependencies
        run: python -m pip install packaging
      - name: Validate versions and artifact counts
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from packaging.utils import parse_wheel_filename
          wheels = list(Path('dist').glob('*.whl'))
          sdists = list(Path('dist').glob('*.tar.gz'))
          assert len(wheels) == 6, [p.name for p in wheels]
          assert len(sdists) == 1, [p.name for p in sdists]
          tag = os.environ['RELEASE_TAG'].removeprefix('v')
          core = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          native = tomllib.loads(Path('rust/cinnamon-core/pyproject.toml').read_text())['project']['version']
          assert tag == core == native, (tag, core, native)
          counts = {'velto-core': 0, 'velto-cinnamon-core': 0}
          for wheel in wheels:
              name, version, _, _ = parse_wheel_filename(wheel.name)
              assert str(version) == tag, wheel.name
              counts[str(name)] += 1
          assert counts == {'velto-core': 1, 'velto-cinnamon-core': 5}, counts
          for p in sorted(Path('dist').iterdir()):
              print(p.name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: dist/*
          if-no-files-found: error

  publish-cinnamon:
    name: Publish Cinnamon Rust to PyPI
    needs: verify-release
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    environment:
      name: pypi-cinnamon
      url: https://pypi.org/project/velto-cinnamon-core/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: all-dist/
      - name: Select Cinnamon wheels
        shell: bash
        run: |
          mkdir -p dist
          cp all-dist/velto_cinnamon_core-*.whl dist/
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 5
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-core:
    name: Publish Velto Core to PyPI
    needs: publish-cinnamon
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    environment:
      name: pypi-core
      url: https://pypi.org/project/velto-core/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: all-dist/
      - name: Select Velto Core distribution
        shell: bash
        run: |
          mkdir -p dist
          cp all-dist/velto_core-*.whl dist/
          cp all-dist/velto_core-*.tar.gz dist/
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
