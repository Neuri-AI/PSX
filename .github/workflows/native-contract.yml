name: Native reactive contract

on:
  push:
    branches: [fixes/psx-issues]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-unit:
    name: Native protocol / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_native_generic_setters.py tests/test_native_reactive_props.py -k 'not qt_reconciles'

  native-qt:
    name: Native Qt offscreen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install -e '.[dev,pyside6]'
      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q tests/test_native_reactive_props.py tests/test_native_generic_setters.py
