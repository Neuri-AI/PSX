name: P0 Kivy heap ownership A-B

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: "Cycles per mode; separate fresh runner per mode"
        type: choice
        required: true
        default: "5000"
        options: ["1000", "5000", "10000"]
  push:
    branches: [develop]
    paths:
      - "scripts/p0_kivy_heap_ownership.py"
      - "tests/test_p0_kivy_heap_ownership.py"
      - ".github/workflows/p0-kivy-heap-ownership.yml"

permissions:
  contents: read

concurrency:
  group: p0-kivy-heap-ownership-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Kivy ${{ matrix.mode }} heap ownership
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        mode: [velto, native, psx_no_cinnamon]
    env:
      KIVY_NO_FILELOG: "1"
      KIVY_NO_ARGS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install native Kivy dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libgl1 libgl1-mesa-dri \
            libmtdev1 libx11-6 libxext6 libxrender1 libxrandr2 libxcursor1 \
            libxi6 libsm6 libice6 libasound2-dev
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,kivy]"
          python -m pip install psutil
      - name: Test profiler dead-proxy-safe classification
        run: python -m pytest -q tests/test_p0_kivy_heap_ownership.py
      - name: Run isolated ownership profiler
        run: |
          mkdir -p artifacts
          xvfb-run -a python scripts/p0_kivy_heap_ownership.py \
            --mode "${{ matrix.mode }}" \
            --cycles "${{ github.event.inputs.cycles || '5000' }}" \
            --json-out "artifacts/kivy-${{ matrix.mode }}-ownership.json"
      - name: Archive heap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-kivy-heap-${{ matrix.mode }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
