name: F5.5 G4 reference coverage

on:
  pull_request:
    branches: [develop]
    paths:
      - "docs/public/reference/**"
      - "docs/architecture/f5-5-api-exports.json"
      - "scripts/docs/validate_api_reference.py"
      - "scripts/docs/generate_g4_reference.py"
      - "tests/test_docs_api_reference.py"
      - ".github/workflows/f5-5-api-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-api-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checked-out PSX package
        run: python -m pip install -e .
      - name: Generate source-backed API contracts
        run: |
          python -m scripts.docs.generate_g4_reference --write
          python -m scripts.docs.generate_g4_reference --check
      - uses: actions/upload-artifact@v4
        with:
          name: g4-generated-api-contracts
          path: docs/public/reference/generated-contracts.mdx
      - name: Verify API inventory and index
        run: |
          python scripts/docs/validate_api_reference.py
          python -m unittest discover -s tests -p test_docs_api_reference.py -v
