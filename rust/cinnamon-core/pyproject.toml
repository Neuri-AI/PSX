
[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "velto-cinnamon-core"
version = "0.1.1"
description = "Cinnamon Rust layout engine for Velto"
requires-python = ">=3.10"
dependencies = []

[tool.maturin]
manifest-path = "Cargo.toml"
features = ["python"]
bindings = "pyo3"
module-name = "_sfle_native"