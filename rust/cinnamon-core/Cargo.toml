[package]
name = "cinnamon-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Cinnamon native layout engine for Velto"

[lib]
name = "sfle_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
# Desktop keeps a single stable ABI wheel (CPython 3.10+).
default = ["abi3"]
abi3 = ["pyo3/abi3-py310"]
python = ["dep:pyo3"]

[dependencies]
# Android builds use --no-default-features --features python to produce
# version-specific CPython wheels linked to the matching Android libpython.
pyo3 = { version = "0.27", optional = true, features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"